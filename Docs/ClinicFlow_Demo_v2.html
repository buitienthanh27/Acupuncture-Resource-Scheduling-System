 <div class="cf-analytics-layout cf-equal mt16"><div class="cf-card">${cfSection('Khối lượng công việc nhân sự','Phút trực tiếp được phân công theo lịch · không tính 20 phút máy tự chạy')}${top.map(s=>`<div class="cf-hbar"><div class="cf-hbar-top"><span class="cf-name">${cfH(s.name)}</span><strong>${s.minutes} phút · ${s.visits} lượt</strong></div><div class="cf-hbar-track"><div class="cf-hbar-fill" style="width:${s.minutes/max*100}%"></div></div></div>`).join('')||'<div class="cf-empty">Chưa có dữ liệu</div>'}</div><div class="cf-card">${cfSection('Lịch điều trị & công việc','Các lượt trong ngày; bấm để xem bệnh nhân')}${visits.slice(0,6).map(v=>`<button class="cf-mini-row" style="width:100%;border-left:0;border-right:0;border-top:0;background:white;text-align:left" data-action="visit-detail" data-id="${v.id}">${cfMiniVisit(v).replace(/^<div class="cf-mini-row">/,'').replace(/<\/div>$/,'')}</button>`).join('')||'<div class="cf-empty">Chưa có lịch</div>'}<div class="cf-section-divider"></div><div class="cf-inline-actions">${btn('navigate','Xem bảng phân công','btn-outline','data-view="operation"')}${btn('navigate','Xem báo cáo','btn-outline','data-view="reports"')}</div></div></div>`;
};
function cfOperationRoster(date,time){let people=data.staff.map(s=>({s,state:cfSnapshotStaff(s,date,time)}));const f=ui.cfStaffFilter;let shown=people.filter(x=>f==='all'||(f==='available'?['free','machine'].includes(x.state.state):f===x.state.state));let counts={free:people.filter(x=>x.state.state==='free').length,machine:people.filter(x=>x.state.state==='machine').length,busy:people.filter(x=>x.state.state==='busy').length,off:people.filter(x=>x.state.state==='off').length};return `<div class="cf-card">${cfSection('Bảng trực nhân viên','Tình trạng theo giai đoạn công việc và thời điểm đã chọn',`<span class="cf-badge-small">${people.length} nhân viên</span>`)}<div class="cf-board-search">${[['all','Tất cả',people.length],['available','Có thể nhận',counts.free+counts.machine],['busy','Đang thao tác',counts.busy],['machine','Máy chạy',counts.machine],['off','Ngoài ca',counts.off]].map(([k,l,n])=>`<button class="cf-filter-tab ${f===k?'active':''}" data-cf-action="roster-filter" data-value="${k}">${l} · ${n}</button>`).join('')}</div><div class="cf-staff-board">${shown.map(({s,state:a})=>`<div class="cf-roster-card ${a.state}">${avatar(s.name)}<div class="cf-roster-details"><div class="cf-roster-name">${cfH(s.name)}</div>${cfTinyBadge(a.state,a.label)}<div class="cf-roster-patient">${a.patient?cfH(a.patient.name):a.state==='free'?'Sẵn sàng nhận lượt mới':'—'}</div><div class="cf-roster-text">${cfH(a.info)}${a.bed?' · '+cfH(a.bed.name):''}</div><div class="cf-roster-foot">${s.shiftStart}–${s.shiftEnd}${a.until?' · Đến '+a.until:''} · ${s.skills.length} kỹ năng</div></div>${a.visit?`<button class="circle-btn" title="Xem lượt điều trị" data-action="visit-detail" data-id="${a.visit.id}">${ico('info',14)}</button>`:''}</div>`).join('')||'<div class="cf-empty">Không có nhân viên phù hợp với bộ lọc.</div>'}</div><div class="cf-note mt16">* Trạng thái “có thể nhận việc khác” chỉ áp dụng nếu quy tắc chuyên môn và điều kiện giám sát cho phép; mọi lịch mới vẫn được kiểm tra xung đột trước khi lưu.</div></div>`;}
function cfOperationBeds(date,time){let beds=data.beds.map(b=>({b,a:cfSnapshotBed(b,date,time)})),free=beds.filter(x=>x.a.state==='free').length,clean=beds.filter(x=>x.a.state==='clean').length;return `<div class="cf-card">${cfSection('Sơ đồ giường & thiết bị','Chọn giường để xem bệnh nhân và lịch sử sử dụng',`<span class="cf-badge-small">${free} giường trống</span>`)}<div class="cf-bed-board">${beds.map(({b,a})=>`<button class="cf-bed-card ${a.state}" data-action="bed-detail" data-id="${b.id}"><div class="cf-bed-top"><span class="cf-bed-name">${ico('bed',15)} ${cfH(b.name)}</span>${cfTinyBadge(a.state,cfStatus(a.state))}</div><div class="cf-bed-desc">${a.patient?cfH(a.patient.name):a.state==='off'?'Đang bảo trì':a.state==='clean'?'Chưa sẵn sàng':'Giường sẵn sàng'}</div><div class="cf-bed-sub">${a.staff?cfH(a.staff.name)+' · ':''}${cfH(a.info)}${a.ready?' · Trống lại '+a.ready:''}</div></button>`).join('')}</div><div class="cf-insight mt16"><strong>${free}</strong> giường trống · <strong>${clean}</strong> cần dọn. Việc sử dụng lại giường phải có xác nhận hoàn tất vệ sinh và không trùng các lịch đã đặt.</div></div>`;}
function cfOperationAppointments(date){let visits=dayVisits(date);return `<div class="cf-card">${cfSection('Lịch điều trị trong ngày','Hồ sơ bệnh nhân · thời lượng · nhân viên · giường · trạng thái',`<span class="cf-badge-small">${visits.length} lượt</span>`)}<div class="cf-appointments"><div class="cf-appointment cf-head"><span>THỜI GIAN</span><span>BỆNH NHÂN</span><span>PHƯƠNG PHÁP</span><span class="cf-appt-resource">PHÂN CÔNG</span><span>TRẠNG THÁI</span><span>CHI TIẾT</span></div>${visits.map(v=>{let p=getPatient(v.patientId),t=timeline(v);return `<div class="cf-appointment"><div class="cf-appt-time">${v.start}–${hm(t.end)}<small>${t.total} phút · ${v.id}</small></div><div class="cf-appt-patient"><strong>${cfH(p?.name||'Không tìm thấy hồ sơ')}</strong><span>${cfH(p?.externalId||v.patientId)} · ${cfH(patientYear(p?.year))} · ${cfH(patientGender(p?.gender))}</span></div><div class="cf-appt-meta"><b>${cfH(procName(v.procIds))}</b><span>${v.procIds.length} phương pháp</span></div><div class="cf-appt-meta cf-appt-resource"><b>${cfH(getStaff(v.staffId)?.name||'—')}</b><span>${cfH(getBed(v.bedId)?.name||'—')} · ${cfH(getDevice(v.deviceId)?.name||'Không cần máy')}</span></div><div>${pill(v.status)}</div><div>${btn('visit-detail','Chi tiết','btn-sm btn-outline',`data-id="${v.id}"`)}</div></div>`;}).join('')||'<div class="cf-empty">Chưa có lượt điều trị trong ngày. Hãy tìm hoặc tạo hồ sơ bệnh nhân trước khi phân công.</div>'}</div></div>`;}
renderOperation=function(){let date=ui.operationDate,time=ui.cfTime,staff=data.staff.map(s=>cfSnapshotStaff(s,date,time)),beds=data.beds.map(b=>cfSnapshotBed(b,date,time)),can=staff.filter(s=>['free','machine'].includes(s.state)).length,active=staff.filter(s=>s.state==='busy').length,free=beds.filter(b=>b.state==='free').length,clean=beds.filter(b=>b.state==='clean').length;return cfHeader('TRUNG TÂM ĐIỀU PHỐI · TEAM LEAD','Bàn điều phối điều trị','Nhìn toàn bộ nhân sự và 10 giường tại một thời điểm trước khi tiếp nhận bệnh nhân.',`${btn('navigate',`${ico('users')} Hồ sơ bệnh nhân`,'btn-outline','data-view="patients"')}<button class="btn btn-primary" data-cf-action="open-wizard">${ico('plus')} Tiếp nhận & xếp lịch</button>`)+`
 <div class="cf-controls-card cf-card"><div class="cf-oper-controls"><div class="cf-day-control"><div><label>NGÀY ĐIỀU PHỐI</label><input type="date" id="operation-date" value="${date}"></div><div><label>MỐC GIỜ KIỂM TRA</label><input type="time" id="cf-operation-time" value="${time}" step="300"></div></div><button class="btn btn-outline" data-cf-action="now">${ico('clock')} Hiện tại</button></div><div class="cf-ref-note">Trạng thái theo giờ tham chiếu từ lịch. Không phải giám sát thiết bị trực tuyến.</div></div>
 <div class="cf-kpi-grid mb16">${cfKpi('Có thể nhận công việc',`${can}/${data.staff.length}`,`${active} đang thao tác`,'user')}${cfKpi('Giường trống',`${free}/${data.beds.length}`,`${clean} chờ dọn`,'bed','cf-blue')}${cfKpi('Lượt điều trị trong ngày',dayVisits(date).length,'Đã được Lead phân công','calendar')}${cfKpi('Máy điện châm hoạt động',data.devices.filter(d=>d.status==='active').length,`Tổng ${data.devices.length} máy đã khai báo`,'activity','cf-warm')}</div>
 <div class="cf-card mb16"><div class="cf-section-head" style="margin:0"><div><h2>Quy trình tiếp nhận nhanh</h2><p>Bệnh nhân phải có hồ sơ trước khi được chọn giường và nhân viên.</p></div><div class="cf-inline-actions">${btn('new-patient','+ Thêm hồ sơ','btn-outline')}<button class="btn btn-primary" data-cf-action="open-wizard">Xếp lịch từ hồ sơ →</button></div></div><div class="cf-workflow-steps mt16"><span class="cf-flow-step"><b>1</b> Tìm / tạo hồ sơ</span><span class="cf-flow-arrow">→</span><span class="cf-flow-step"><b>2</b> Thủ thuật + ngày giờ</span><span class="cf-flow-arrow">→</span><span class="cf-flow-step"><b>3</b> Nhân viên + giường + máy</span><span class="cf-flow-arrow">→</span><span class="cf-flow-step"><b>4</b> Xác nhận lịch</span></div></div>
 <div class="cf-operation-top">${cfOperationRoster(date,time)}${cfOperationBeds(date,time)}</div><div class="mt16">${cfOperationAppointments(date)}</div>
 <div class="cf-insight mt16">Thời lượng, giám sát trực tiếp, khả năng ghép thủ thuật và thời gian vệ sinh là cấu hình dự thảo. Khi vận hành thật cần quy trình được người có thẩm quyền chuyên môn duyệt; dữ liệu đang dùng hoàn toàn là dữ liệu demo.</div>`;};

renderPatients=function(){let q=(ui.filter||'').toLowerCase(),pats=data.patients.filter(p=>[p.name,p.id,p.externalId,p.phone].join(' ').toLowerCase().includes(q));return cfHeader('01 · TIẾP NHẬN HỒ SƠ','Danh sách bệnh nhân','Chỉ tạo lịch điều trị khi đã có hồ sơ. Có thể tìm theo tên, mã HIS hoặc mã bệnh nhân.',btn('new-patient',`${ico('plus')} Tạo hồ sơ mới`,'btn-primary'))+`<div class="cf-guide">${ico('info',18)}<div><b>Nguyên tắc luồng dữ liệu:</b> tạo hoặc chọn hồ sơ bệnh nhân → kiểm tra chỉ định điều trị → mới được chọn giường, nhân viên và máy. Hồ sơ ở đây chỉ là thông tin tham chiếu; không thay thế phần mềm HIS/EMR.</div></div><div class="cf-card"><div class="cf-section-head"><div><h2>Hồ sơ đã tiếp nhận</h2><p>${pats.length} / ${data.patients.length} hồ sơ đang hiển thị</p></div><div class="search">${ico('search')}<input id="page-search" placeholder="Tìm bệnh nhân hoặc mã HIS..." value="${cfH(ui.filter)}"></div></div><div class="cf-patient-list">${pats.map(p=>{let recent=latestStaff(p.id),count=data.visits.filter(v=>v.patientId===p.id&&v.status!=='cancelled').length;return `<div class="cf-patient-tile">${avatar(p.name)}<div class="cf-info"><strong>${cfH(p.name)}</strong><p>${cfH(p.externalId)} · ${cfH(patientGender(p.gender))} · ${cfH(patientYear(p.year))}</p><div class="cf-sub">${count} lượt · Nhân viên gần nhất: <b>${cfH(getStaff(recent)?.name||'Chưa có')}</b></div></div><div class="cf-patient-actions">${btn('new-visit','Xếp lịch','btn-sm btn-primary',`data-patient="${p.id}"`)}${btn('patient-detail','Hồ sơ','btn-sm btn-outline',`data-id="${p.id}"`)}${btn('edit-patient',ico('edit',14),'btn-sm btn-outline',`data-id="${p.id}"`)}${btn('delete-patient',ico('trash',14),'btn-sm btn-danger',`data-id="${p.id}"`)}</div></div>`;}).join('')||'<div class="cf-empty">Không có hồ sơ phù hợp. Tạo hồ sơ mới để bắt đầu.</div>'}</div></div>`;};

renderStaff=function(){let d=ui.operationDate||vnDate(),t=ui.cfTime,items=data.staff.filter(p=>!ui.filter||[p.name,p.id,p.position].join(' ').toLowerCase().includes(ui.filter.toLowerCase()));let now=data.staff.map(s=>({s,a:cfSnapshotStaff(s,d,t)}));return cfHeader('QUẢN LÝ NGUỒN LỰC · NHÂN SỰ','Nhân sự & phân công','Quản lý ca trực, phạm vi kỹ năng và tình trạng thao tác tại mốc giờ trên bàn điều phối.',isOwner()?btn('new-staff',`${ico('plus')} Thêm nhân viên`,'btn-primary'):'')+`<div class="cf-kpi-grid mb16">${cfKpi('Tổng nhân viên',data.staff.length,'Danh mục nhân sự','users')}${cfKpi('Đang thao tác',now.filter(x=>x.a.state==='busy').length,'Theo giờ điều phối','activity','cf-blue')}${cfKpi('Rảnh thao tác',now.filter(x=>['machine','free'].includes(x.a.state)).length,'Đủ điều kiện nhận lịch mới','check')}${cfKpi('Vắng / ngoài ca',now.filter(x=>x.a.state==='off').length,'Không nhận được lịch','clock','cf-warm')}</div><div class="cf-card"><div class="cf-section-head"><div><h2>Danh mục nhân sự</h2><p>Thêm / sửa / xóa với vai trò Chủ; Lead được xem và phân công.</p></div><div class="search">${ico('search')}<input id="page-search" placeholder="Tìm tên, chức danh..." value="${cfH(ui.filter)}"></div></div><div class="cf-report-table"><table><thead><tr><th>Nhân viên</th><th>Chuyên môn & ca</th><th>Tại ${cfH(t)}</th><th>Giường / bệnh nhân</th><th>Thao tác</th></tr></thead><tbody>${items.map(s=>{let a=cfSnapshotStaff(s,d,t);return `<tr><td><strong>${cfH(s.name)}</strong><br>${cfH(s.id)}</td><td>${cfH(s.position)}<br>${cfH(s.shiftStart)}–${cfH(s.shiftEnd)} · ${s.skills.length} kỹ năng</td><td>${cfTinyBadge(a.state,a.label)}</td><td>${a.patient?cfH(a.patient.name)+' · '+cfH(a.bed?.name||''):'—'}</td><td>${isOwner()?`${btn('edit-staff','Sửa','btn-sm btn-outline',`data-id="${s.id}"`)} ${btn('delete-staff','Xóa','btn-sm btn-danger',`data-id="${s.id}"`)}`:btn('staff-detail','Xem','btn-sm btn-outline',`data-id="${s.id}"`)}</td></tr>`;}).join('')}</tbody></table></div><div class="cf-note mt16">Trạng thái nghề nghiệp, chuyên môn và giấy phép cần được bộ phận có thẩm quyền kiểm chứng; đây không phải hệ thống xác thực chứng chỉ.</div></div>`;};

ghi chú')}</td><td>${beds?btn('bed-detail','Chi tiết','btn-sm btn-outline',`data-id="${b.id}"`):''} ${isOwner()?`${btn(beds?'edit-bed':'edit-device','Sửa','btn-sm btn-outline',`data-id="${b.id}"`)} ${btn(beds?'delete-bed':'delete-device','Xóa','btn-sm btn-danger',`data-id="${b.id}"`)}`:''}</td></tr>`}).join('')}</tbody></table></div><div class="cf-note mt16">Giường chỉ có thể tái sử dụng sau khi hoàn tất lượt, hết thời gian cấu hình và xác nhận vệ sinh nếu có phiếu dọn chờ xử lý.</div></div>`;};

/* Explicit, patient-first scheduling wizard. The existing scheduling validator and persistence are reused. */
function cfWizardPatientCard(pid){let p=getPatient(pid);if(!p)return '<div class="cf-wizard-hint">Chưa chọn hồ sơ. Tìm bệnh nhân hoặc tạo hồ sơ mới.</div>';let old=latestStaff(pid);return `<div class="cf-wizard-selected">${avatar(p.name)}<div style="flex:1"><strong>${cfH(p.name)}</strong><br><small>${cfH(p.externalId)} · ${patientYear(p.year)} · ${patientGender(p.gender)}</small></div>${old?`<span class="cf-badge-small">Ưu tiên: ${cfH(getStaff(old)?.name||'')}</span>`:'<span class="cf-badge-small">Bệnh nhân mới</span>'}</div>`;}
function cfWizardPatientMatches(q='',selected=''){let pats=data.patients.filter(p=>p.status==='active'&&[p.name,p.externalId,p.id,p.phone].join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,10);return pats.map(p=>{let recent=getStaff(latestStaff(p.id));return `<button type="button" data-cf-action="pick-patient" data-patient="${p.id}" class="cf-patient-choice ${selected===p.id?'selected':''}">${avatar(p.name)}<span style="flex:1"><strong>${cfH(p.name)}</strong><small>${cfH(p.externalId)} · ${patientYear(p.year)} · ${patientGender(p.gender)}</small></span><span class="cf-last">${recent?'Đã từng điều trị<br>'+cfH(recent.name):'Hồ sơ mới'}</span></button>`;}).join('')||'<div class="cf-empty">Không tìm thấy hồ sơ. Hãy bấm “Tạo hồ sơ” trước khi xếp lịch.</div>';}
function cfWizardProgress(step){return `<div class="cf-wizard-progress">${[['1','Hồ sơ'],['2','Thủ thuật'],['3','Phân công']].map(([n,l],i)=>`${i?'<div class="cf-wizard-line"></div>':''}<div class="cf-wizard-dot ${step>Number(n)?'done':step===Number(n)?'current':''}" data-cf-step-marker="${n}"><b>${step>Number(n)?'✓':n}</b>${l}</div>`).join('')}</div>`;}
function cfWizardPane(id,contents){return `<section class="cf-wizard-pane" data-cf-step="${id}">${contents}</section>`;}
visitModal=function(v=null,patientId=''){
 let edit=!!v,doc=clone(v||{id:'',patientId:patientId||'',date:ui.operationDate||vnDate(),start:ui.cfTime||hm(nowMinute()),procIds:['diencham'],staffId:'',bedId:'',deviceId:'',overlap:false,orderConfirmed:false,notes:'',status:'planned'});
 if(!doc.staffId&&doc.patientId)doc.staffId=latestStaff(doc.patientId);
 ui.cfWizardSelection=doc.patientId;ui.cfWizardStep=edit?3:doc.patientId?2:1;
 let content=`<form id="visit-form" class="stack gap16">${cfWizardProgress(ui.cfWizardStep)}
 ${cfWizardPane(1,`<div class="cf-wizard-title">1. Chọn hồ sơ bệnh nhân</div><p class="cf-wizard-subtitle">Chọn hồ sơ đã có trong phần mềm. Chưa có bệnh nhân? Tạo hồ sơ trước rồi hệ thống quay lại xếp lịch.</p><label class="cf-modal-label">Tìm bệnh nhân theo tên hoặc mã hồ sơ</label><div class="search" style="width:100%">${ico('search')}<input type="search" id="cf-patient-search" placeholder="Ví dụ: Nguyễn Văn An / HIS-DEMO-01" autocomplete="off"></div><div class="cf-wizard-picker" id="cf-patient-picker">${cfWizardPatientMatches('',doc.patientId)}</div><div id="cf-patient-selection" class="mt16">${cfWizardPatientCard(doc.patientId)}</div><button class="btn btn-outline mt16" type="button" data-cf-action="add-patient">${ico('plus')} Tạo hồ sơ bệnh nhân mới</button><input type="hidden" name="patientId" value="${cfH(doc.patientId)}">`)}
 ${cfWizardPane(2,`<div class="cf-wizard-title">2. Chọn thủ thuật và thời gian</div><p class="cf-wizard-subtitle">Các thủ thuật chỉ được phép sử dụng khi đã kích hoạt và phê duyệt trong cấu hình demo.</p><div id="cf-step2-patient">${cfWizardPatientCard(doc.patientId)}</div><div class="form-grid">${field('date','Ngày điều trị',doc.date,'date','required')}${field('start','Giờ dự kiến bắt đầu',doc.start,'time','required')}</div><label class="cf-modal-label mt16">Phương pháp điều trị (chọn một hoặc nhiều)</label><div class="cf-procedure-tiles">${data.procedures.filter(p=>p.active||doc.procIds.includes(p.id)).map(p=>`<label class="cf-procedure-tile ${doc.procIds.includes(p.id)?'checked':''}"><input type="checkbox" name="procIds" value="${cfH(p.id)}" ${doc.procIds.includes(p.id)?'checked':''} ${!p.approved?'disabled':''}><span>${cfH(p.name)}<small>${phaseTime(p)} phút · ${p.approved?'Có hiệu lực trong demo':'Chờ duyệt'}</small></span></label>`).join('')}</div><label class="check-row mt16"><input type="checkbox" name="overlap" ${doc.overlap?'checked':''}>Cho phép ghép các thủ thuật đã được duyệt tương thích</label><div class="cf-wizard-hint mt16">Hệ thống tính riêng thời gian nhân viên thao tác và giai đoạn máy chạy; chỉ cho phép chồng lấp khi đúng cấu hình.</div>`)}
 ${cfWizardPane(3,`<div class="cf-wizard-title">3. Phân công nhân sự và giường</div><p class="cf-wizard-subtitle">Hệ thống gợi ý nhân viên đã chăm sóc lần trước nếu đủ điều kiện và không trùng thao tác trực tiếp.</p><div id="cf-step3-patient">${cfWizardPatientCard(doc.patientId)}</div><div class="form-grid">${selectField('staffId','Nhân viên điều trị',[['','— Chọn nhân viên —'],...data.staff.map(s=>[s.id,`${s.name}${s.status!=='active'?' (vắng)':''}`])],doc.staffId)}${selectField('bedId','Giường điều trị',[['','— Chọn giường —'],...data.beds.map(b=>[b.id,`${b.name} · ${b.room}`])],doc.bedId)}${selectField('deviceId','Máy / thiết bị',[['','— Không sử dụng —'],...data.devices.map(d=>[d.id,d.name])],doc.deviceId)}</div><div class="cf-recommend mt16" id="visit-recommendation"></div><label class="check-row mt16"><input type="checkbox" name="orderConfirmed" ${doc.orderConfirmed?'checked':''}><strong>Team Lead đã đối chiếu chỉ định điều trị hợp lệ từ hệ thống chuyên môn</strong></label><div class="field"><label>Ghi chú điều phối (không ghi chẩn đoán)</label><textarea name="notes" placeholder="Ví dụ: lưu ý ca trực hoặc nhu cầu hỗ trợ di chuyển...">${cfH(doc.notes||'')}</textarea></div><div id="cf-wizard-summary" class="cf-selected-preview">Chọn nhân viên, giường và xác nhận chỉ định để kiểm tra trước khi lưu.</div>`)}
 <input type="hidden" name="editId" value="${cfH(doc.id)}"><input type="hidden" name="status" value="${cfH(doc.status)}"></form>`;
 const footer=`<div class="cf-wizard-footer"><div class="cf-foot-left"><button type="button" class="btn btn-outline" data-cf-action="wizard-back" id="cf-wizard-back">Quay lại</button>${btn('close-modal','Hủy','btn-outline')}</div><div class="cf-foot-right"><button type="button" class="btn btn-outline" id="cf-wizard-auto" data-cf-action="wizard-auto">${ico('spark')} Gợi ý nhanh</button><button type="button" id="cf-wizard-next" class="btn btn-primary" data-cf-action="wizard-next">Tiếp tục →</button><button type="submit" id="cf-wizard-save" form="visit-form" class="btn btn-primary">${edit?'Lưu thay đổi':'Xác nhận xếp lịch'}</button></div></div>`;
 showModal(edit?'Điều chỉnh lịch đã xếp':'Tiếp nhận & điều phối bệnh nhân','Quy trình 3 bước · chỉ dùng dữ liệu mẫu, không thay thế y lệnh',content,footer,true);
 cfWizardGo(ui.cfWizardStep,false);
};
function cfWizardPreview(){let v=readVisitForm();if(!v)return;let el=document.getElementById('cf-wizard-summary');if(!el)return;let c=v.staffId&&v.bedId?validate(v,{excludeId:v.id}):null;el.innerHTML=`<div><b>Bệnh nhân:</b> ${cfH(getPatient(v.patientId)?.name||'Chưa chọn')}</div><div style="margin-top:4px"><b>Lịch:</b> ${cfH(v.date)} · ${cfH(v.start)} · ${cfH(procName(v.procIds))}</div><div style="margin-top:4px"><b>Phân công:</b> ${cfH(getStaff(v.staffId)?.name||'Chưa chọn')} · ${cfH(getBed(v.bedId)?.name||'Chưa chọn')} · ${cfH(getDevice(v.deviceId)?.name||'Không dùng máy')}</div>${c?`<div style="margin-top:8px;color:${c.ok?'#27805e':'#b56b42'}"><b>${c.ok?'✓ Không trùng tài nguyên; dự kiến kết thúc '+hm(c.timeline.end):'⚠ '+cfH(c.errors[0]||'Cần kiểm tra lại')}</b></div>`:''}`;}
function cfWizardGo(next,pick=true){let f=document.getElementById('visit-form');if(!f)return;const current=ui.cfWizardStep||1;
 if(pick&&next>current){const v=readVisitForm();if(current===1&&!v?.patientId){toast('Cần chọn hoặc tạo hồ sơ bệnh nhân trước.','warn');return;}
  if(current===2){if(!v.procIds.length){toast('Hãy chọn ít nhất một thủ thuật.','warn');return;}if(!validProcIds(v.procIds)){toast('Có thủ thuật chưa được phê duyệt hoặc kích hoạt.','warn');return;}if(!v.date||!v.start){toast('Cần chọn ngày và giờ bắt đầu.','warn');return;}}
 }
 ui.cfWizardStep=Math.max(1,Math.min(3,next));const step=ui.cfWizardStep;
 f.querySelectorAll('[data-cf-step]').forEach(p=>p.classList.toggle('current',+p.dataset.cfStep===step));f.querySelectorAll('[data-cf-step-marker]').forEach(p=>{const n=+p.dataset.cfStepMarker;p.className='cf-wizard-dot '+(n<step?'done':n===step?'current':'');p.querySelector('b').textContent=n<step?'✓':n;});
 const back=document.getElementById('cf-wizard-back'),cont=document.getElementById('cf-wizard-next'),save=document.getElementById('cf-wizard-save'),auto=document.getElementById('cf-wizard-auto');back.style.display=step===1?'none':'';cont.style.display=step===3?'none':'';save.style.display=step===3?'':'none';auto.style.display=step===3?'':'none';
 if(step===2){let label=document.getElementById('cf-step2-patient');if(label)label.innerHTML=cfWizardPatientCard(f.elements.namedItem('patientId')?.value);}
 if(step===3){let label=document.getElementById('cf-step3-patient');if(label)label.innerHTML=cfWizardPatientCard(f.elements.namedItem('patientId')?.value);refreshVisitRecommendation();cfWizardPreview();}
 let modal=document.querySelector('.modal-body');if(modal)modal.scrollTop=0;
}
function cfWizardPick(pid){let p=getPatient(pid),f=document.getElementById('visit-form');if(!p||!f)return;f.elements.namedItem('patientId').value=pid;ui.cfWizardSelection=pid;let selection=document.getElementById('cf-patient-selection');if(selection)selection.innerHTML=cfWizardPatientCard(pid);let input=document.getElementById('cf-patient-search');if(input)input.value=p.name;let matches=document.getElementById('cf-patient-picker');if(matches)matches.innerHTML=cfWizardPatientMatches(p.name,pid);let prev=latestStaff(pid);if(prev&&f.elements.namedItem('staffId'))f.elements.namedItem('staffId').value=prev;cfWizardGo(2,true);}
function cfWizardAuto(){let f=document.getElementById('visit-form'),base=readVisitForm();if(!f||!base)return;if(!base.patientId){toast('Vui lòng chọn bệnh nhân.','warn');return;}const rec=findCandidateOptions({...base,orderConfirmed:true},base.id);let candidate=rec.candidates[0]?.candidate;if(!candidate){candidate=findEarliest({...base,orderConfirmed:true},base.id);}if(!candidate){toast('Chưa có tổ hợp khả thi trong ngày. Hãy đổi giờ hoặc phương pháp.','warn');return;}for(const k of ['staffId','bedId','deviceId','start']){let el=f.elements.namedItem(k);if(el)el.value=candidate[k]||'';}refreshVisitRecommendation();cfWizardPreview();toast(`Gợi ý: ${getStaff(candidate.staffId)?.name} · ${getBed(candidate.bedId)?.name} · ${candidate.start}.`);}

renderTasks=function(){const date=ui.operationDate,list=dayVisits(date).filter(v=>role()!=='staff'||v.staffId===currentUser()?.staffId),f=ui.cfTaskFilter,visible=list.filter(v=>f==='all'||v.status===f),pending=data.cleanups.filter(c=>c.status==='pending'&&(role()!=='staff'||data.visits.find(v=>v.id===c.visitId)?.staffId===currentUser()?.staffId));return cfHeader('CÔNG VIỆC ĐIỀU TRỊ · THEO VAI TRÒ',role()==='staff'?'Công việc của tôi':'Bảng công việc điều trị','Mỗi công việc hiển thị tên, mã hồ sơ, năm sinh và giới tính bệnh nhân cùng thời gian điều trị.',`<input type="date" class="select-inline" id="operation-date" value="${date}">`)+`<div class="cf-kpi-grid mb16">${cfKpi('Lượt được phân công',list.length,'Theo ngày đang xem','calendar')}${cfKpi('Đã hoàn thành',list.filter(x=>x.status==='completed').length,'Đã xác nhận kết thúc','check')}${cfKpi('Chờ điều trị',list.filter(x=>x.status==='planned').length,'Lịch chưa bắt đầu','clock','cf-blue')}${cfKpi('Giường chờ dọn',pending.length,'Cần xác nhận trước lượt tiếp','bed','cf-warm')}</div><div class="cf-card"><div class="cf-section-head"><div><h2>Danh sách công việc</h2><p>Làm đúng lượt được phân công, kiểm tra hồ sơ bệnh nhân trước khi thao tác.</p></div><div class="cf-board-search" style="margin:0">${[['all','Tất cả'],['planned','Chờ bắt đầu'],['in_progress','Đang làm'],['completed','Đã xong']].map(([k,l])=>`<button class="cf-filter-tab ${f===k?'active':''}" data-cf-action="task-filter" data-value="${k}">${l}</button>`).join('')}</div></div><div class="cf-task-group">${visible.map(v=>{let p=getPatient(v.patientId),t=timeline(v);return `<div class="cf-task"><div class="cf-task-patient">${avatar(p?.name||'BN')}<div style="min-width:0"><strong>${cfH(p?.name||'Không có hồ sơ')}</strong><small>Mã HIS: ${cfH(p?.externalId||'—')} · ${cfH(patientGender(p?.gender))} · ${patientYear(p?.year)}<br>Mã lượt: ${v.id} · ${cfH(p?.phone||'Chưa có số liên hệ')}</small><div class="mt8">${pill(v.status)}</div></div></div><div class="cf-task-meta"><b>${v.start}–${hm(t.end)} · ${t.total} phút</b>${cfH(procName(v.procIds))}<br>${cfH(getStaff(v.staffId)?.name||'—')} · ${cfH(getBed(v.bedId)?.name||'—')}<br>${cfH(getDevice(v.deviceId)?.name||'Không cần máy')}</div><div class="cf-task-actions">${btn('visit-detail','Chi tiết','btn-sm btn-outline',`data-id="${v.id}"`)}${v.status==='planned'&&canOperateVisit(v)?btn('start-visit','Bắt đầu','btn-sm btn-primary',`data-id="${v.id}"`):''}${v.status==='in_progress'&&canOperateVisit(v)?btn('complete-visit','Kết thúc','btn-sm btn-primary',`data-id="${v.id}"`):''}</div></div>`}).join('')||'<div class="cf-empty">Không có công việc phù hợp bộ lọc.</div>'}</div></div>${pending.length?`<div class="cf-card mt16">${cfSection('Danh sách giường chờ vệ sinh','Hoàn tất vệ sinh trước khi nhận bệnh nhân khác')}${pending.map(c=>{let v=data.visits.find(x=>x.id===c.visitId),p=getPatient(v?.patientId);return `<div class="cf-mini-row"><span class="cf-brief-badge clean">Chờ dọn</span><div class="cf-mini-info"><strong>${cfH(getBed(c.bedId)?.name||c.bedId)} · ${cfH(p?.name||'')}</strong><span>${c.visitId} · Thời gian cấu hình ${data.settings.cleanup} phút</span></div>${btn('finish-cleanup','Xác nhận đã dọn','btn-sm btn-primary',`data-id="${c.id}"`)}</div>`;}).join('')}</div>`:''}<div class="cf-note mt16">Dữ liệu thời điểm bắt đầu/kết thúc là trạng thái mô phỏng. Trong triển khai thật cần đồng bộ dấu thời gian thực tế và nhật ký người xác nhận.</div>`;};
/* The report is calculated from the same live demo visit records used by scheduling. */
function cfReportData(){let sc=cfScope(),visits=cfVisitAll(sc.from,sc.to),stats=cfVisitStats(visits,sc.days),cancelled=data.visits.filter(v=>v.date>=sc.from&&v.date<=sc.to&&v.status==='cancelled'),daily=cfDayList(sc.to,sc.days).map(date=>({date,label:sc.days>7?date.slice(8):date.slice(8)+'/'+date.slice(5,7),value:visits.filter(v=>v.date===date).length})),steps=cfTotal(visits,v=>v.procIds.length),usedBeds=new Set(visits.map(v=>v.bedId)).size;return {sc,visits,stats,cancelled,daily,steps,usedBeds,procedures:cfProcedureCount(visits),staff:cfTopStaff(visits)};}
function cfReportControls(){let R=cfReportData();return `<div class="cf-card mb16"><div class="cf-section-head" style="margin:0"><div class="cf-day-control"><div><label>NGÀY KẾT THÚC BÁO CÁO</label><input type="date" id="report-date" value="${R.sc.to}"></div><div><label>KHOẢNG THỜI GIAN</label><div class="cf-report-range">${[['1','Hôm nay'],['7','7 ngày'],['30','30 ngày']].map(([k,n])=>`<button data-cf-action="report-range" data-value="${k}" class="${ui.cfRange===k?'active':''}">${n}</button>`).join('')}</div></div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="cf-badge-small">${dateLong(R.sc.from)} – ${dateLong(R.sc.to)}</span><small class="cf-ref-note">Báo cáo điều phối nội bộ · dữ liệu giả lập</small></div></div></div>`;}
function cfReportAnalytics(R){let {visits,stats,procedures,staff,daily,cancelled}=R,productive=staff.filter(x=>x.visits>0).slice(0,8),max=Math.max(1,...productive.map(x=>x.minutes)),compPercent=stats.total?Math.round(stats.complete/stats.total*100):0;return `<div class="cf-kpi-grid mb16">${cfKpi('Lượt điều trị',stats.total,`${stats.patients} bệnh nhân duy nhất`,'calendar')}${cfKpi('Đã hoàn thành',stats.complete,`${compPercent}% trong lượt đã lập`,'check')}${cfKpi('Tổng thủ thuật',stats.proc,`Trung bình ${stats.total?(stats.proc/stats.total).toFixed(1):0} thủ thuật/lượt`,'clipboard','cf-blue')}${cfKpi('Thời lượng giường dự kiến',`${stats.bedMinutes}p`,`${stats.bedUtil}% năng lực theo giờ mở cửa*`,'bed','cf-warm')}</div>
 <div class="cf-analytics-layout mb16"><div class="cf-card">${cfSection('Xu hướng điều trị','Thống kê từ các lượt chưa bị hủy theo ngày',`<span class="cf-badge-small">${stats.total} lượt</span>`)}${cfChartLine(daily)}<div class="cf-insight">${stats.total?`Có <strong>${stats.patients} bệnh nhân</strong> được ghi nhận trong giai đoạn này. Tổng <strong>${stats.proc} thủ thuật</strong> và <strong>${cancelled.length} lịch bị hủy</strong>.`:'Chưa có dữ liệu lịch cho khoảng thời gian đã chọn. Biểu đồ hiển thị 0 thay vì dựng số liệu giả.'}</div></div><div class="cf-card">${cfSection('Cơ cấu phương pháp','Phân loại theo từng thủ thuật; một lượt có thể kết hợp nhiều phương pháp')}${cfChartDonut(procedures)}</div></div>
 <div class="cf-analytics-layout cf-equal mb16"><div class="cf-card">${cfSection('Khung giờ tiếp nhận','Số lượt bắt đầu theo từng giờ · cộng gộp toàn khoảng báo cáo')}${cfChartBars(cfHourCounts(visits))}<p class="cf-note">Biểu đồ giúp Lead chọn ca trực phù hợp với giờ cao điểm, không phản ánh thời gian chờ thực tế.</p></div><div class="cf-card">${cfSection('Phân bổ nhân sự','Số phút nhân viên trực tiếp được chiếm dụng, tính từ quy tắc từng giai đoạn')}${productive.map(s=>`<div class="cf-hbar"><div class="cf-hbar-top"><span class="cf-name">${cfH(s.name)}</span><strong>${s.minutes}p · ${s.visits} lượt</strong></div><div class="cf-hbar-track"><div class="cf-hbar-fill ${s.minutes===max?'':'blue'}" style="width:${Math.max(2,s.minutes/max*100)}%"></div></div></div>`).join('')||'<div class="cf-empty">Chưa có dữ liệu</div>'}<p class="cf-note">Không tính 20 phút máy chạy như thời gian thao tác trực tiếp nếu cấu hình đã giải phóng nhân viên.</p></div></div>

>${cfH(getStaff(v.staffId)?.name||'—')}</td><td>${cfH(getBed(v.bedId)?.name||'—')}</td><td>${cfH(sStatus(v.status)[1])}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có dữ liệu</td></tr>'}</tbody></table><h2>2. Tổng hợp thủ thuật</h2><table><tr><th>Phương pháp</th><th>Số lần ghi nhận</th></tr>${R.procedures.map(p=>`<tr><td>${cfH(p.label)}</td><td>${p.value}</td></tr>`).join('')||'<tr><td colspan="2">Không có dữ liệu</td></tr>'}</table><h2>3. Báo cáo hoạt động nhân viên (theo lịch)</h2><table><tr><th>Nhân viên</th><th>Lượt điều trị</th><th>Phút thao tác dự kiến</th></tr>${R.staff.filter(x=>x.visits>0).map(x=>`<tr><td>${cfH(x.name)}</td><td>${x.visits}</td><td>${x.minutes}</td></tr>`).join('')}</table><h2>4. Các dữ liệu/hồ sơ cần đối chiếu ngoài ứng dụng</h2><p>Hồ sơ HIS/EMR, chỉ định chuyên môn, giấy phép và phạm vi hành nghề, nhật ký vệ sinh và bảo trì, hồ sơ truy cập và các mẫu báo cáo theo yêu cầu của cơ quan có thẩm quyền.</p><div class="signature"><span>Người lập biểu<br><br>..............................</span><span>Người kiểm tra<br><br>..............................</span><span>Người phê duyệt<br><br>..............................</span></div><p class="small" style="margin-top:50px">ClinicFlow v2.0 · dữ liệu demo lưu tại trình duyệt · Không có giá trị chứng nhận tuân thủ.</p><button class="hide-print" onclick="window.print()">In / lưu PDF</button></body></html>`;let win=window.open('','_blank');if(!win){toast('Trình duyệt chặn cửa sổ in. Hãy cho phép pop-up.','warn');return;}win.document.write(html);win.document.close();win.focus();setTimeout(()=>win.print(),350);audit('In báo cáo tổng hợp',`Giai đoạn ${R.sc.from}–${R.sc.to}`);};
/* UI interactions for the new controls, without changing the original CRUD and visit event handlers. */
document.addEventListener('click',e=>{
 const node=e.target.closest('[data-cf-action]');if(!node)return;
 switch(node.dataset.cfAction){
  case 'roster-filter':ui.cfStaffFilter=node.dataset.value;render();break;
  case 'now':ui.operationDate=vnDate();ui.cfTime=hm(nowMinute());render();break;
  case 'open-wizard':if(isLead())visitModal();break;
  case 'wizard-back':cfWizardGo(ui.cfWizardStep-1,false);break;
  case 'wizard-next':cfWizardGo(ui.cfWizardStep+1,true);break;
  case 'pick-patient':cfWizardPick(node.dataset.patient);break;
  case 'add-patient':ui.cfPendingPatient=true;patientModal();break;
  case 'wizard-auto':cfWizardAuto();break;
  case 'task-filter':ui.cfTaskFilter=node.dataset.value;render();break;
  case 'report-range':ui.cfRange=node.dataset.value;render();break;
  case 'report-tab':ui.cfReportTab=node.dataset.value;render();break;
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='cf-operation-time'){ui.cfTime=e.target.value||'09:00';render();return;}
 if(e.target.closest('#visit-form')){
  if(e.target.name==='patientId'){const id=e.target.value,st=latestStaff(id);if(st){let f=e.target.form;const selected=f?.elements.namedItem('staffId');if(selected)selected.value=st;}}
  if(e.target.name==='procIds'){let card=e.target.closest('.cf-procedure-tile');if(card)card.classList.toggle('checked',e.target.checked);}
  cfWizardPreview();
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='cf-patient-search'){
  const pick=document.getElementById('cf-patient-picker');if(pick)pick.innerHTML=cfWizardPatientMatches(e.target.value,ui.cfWizardSelection);
 }
 if(e.target.closest('#visit-form')&&['start','date'].includes(e.target.name))cfWizardPreview();
});
let cfPatientIdsBefore=null;
document.addEventListener('submit',e=>{if(e.target.id==='patient-form'&&ui.cfPendingPatient){cfPatientIdsBefore=new Set(data.patients.map(p=>p.id));}},true);
document.addEventListener('submit',e=>{
 if(e.target.id==='patient-form'&&ui.cfPendingPatient){
  const newly=data.patients.find(p=>!cfPatientIdsBefore?.has(p.id));
  if(newly){ui.cfPendingPatient=false;ui.view='operation';ui.filter='';visitModal(null,newly.id);toast('Đã tạo hồ sơ. Tiếp tục chọn thủ thuật, sau đó phân công giường.');}
 }
});

const cfOriginalOperationBeds=cfOperationBeds;
// Append device block exactly once at the end of the existing beds card.
cfOperationBeds=function(date,time){let html=cfOriginalOperationBeds(date,time);const devices=`<div class="cf-section-divider"></div><div class="cf-section-head" style="margin-bottom:6px"><div><h2>Máy điện châm</h2><p>Phân biệt máy đang dùng và máy sẵn sàng</p></div></div><div class="cf-device-list">${data.devices.map(x=>{let d=cfDeviceSnapshot(x,date,time);return `<div title="${cfH(x.name)} · ${cfH(d.patient?.name||d.label)}" class="cf-device-pill ${d.state}">${ico('activity',14)}<strong>${cfH(x.id)}</strong><span>${cfH(d.label)}</span></div>`}).join('')}</div>`;return html.replace(/<\/div>\s*$/,devices+'</div>');};

// Start app.
render();

</script></body></html>
