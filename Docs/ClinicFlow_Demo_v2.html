   if(suitable){let area=phase.find(z=>z.e-z.s>=phaseTime(p)+data.settings.gapProcedures);start=area.s+data.settings.gapProcedures;}
  }
  let cursor=start;
  p.steps.forEach((st,ix)=>{
   let d=+st.duration||0, seg={s:cursor,e:cursor+d,name:st.name,procId:p.id,staff:!!st.staff,bed:!!st.bed,device:!!st.device,step:ix};
   if(st.staff)staff.push(seg);if(st.bed)bed.push(seg);if(st.device)device.push(seg);all.push(seg);segments.push(seg);cursor+=d;
  });
  baseEnd=Math.max(baseEnd,cursor);
 }
 // Staff gap after patient; bed cleanup is a separate held period. Conservative rule: one bed per entire visit.
 let treatmentEnd=baseEnd;
 if(procedures.length>0){staff.push({s:treatmentEnd,e:treatmentEnd+data.settings.gapPatients,name:'Chuyển bệnh nhân',staff:true});}

 const reg=ui.authTab==='register';document.getElementById('app').innerHTML=`<div class="auth-shell"><div class="auth-visual"><div class="auth-logo"><div class="brand-icon">${ico('logo',25)}</div>ClinicFlow <span style="font-size:10px;font-weight:500;color:#b0d8c9;border:1px solid #ffffff45;padding:3px 7px;border-radius:6px">DEMO v2.0</span></div><div class="auth-hero"><span class="eyebrow">CLINICAL OPERATIONS, REIMAGINED</span><h1>Mọi lượt điều trị.<br/>Một nhịp điều phối.</h1><p>Đồng hành cùng phòng khám Y học cổ truyền trong mỗi ca trực: đúng nhân sự, đúng thiết bị, đúng thời điểm.</p><div class="auth-feature"><span class="icon">${ico('activity',29)}</span><div><strong>Tối ưu thời gian. Tôn trọng quy trình.</strong><div style="font-size:12px;color:#b1d6c5;margin-top:4px">Lịch điều phối thông minh · Theo dõi giường · Nhật ký vận hành</div></div></div></div><div class="auth-foot">BẢN MẪU ĐỂ KHẢO SÁT NGHIỆP VỤ · Không sử dụng với dữ liệu người bệnh thật</div></div><div class="auth-right"><div class="auth-panel"><div class="auth-head"><span class="eyebrow" style="color:var(--primary)">XIN CHÀO</span><h2>${reg?'Tạo tài khoản':'Chào mừng trở lại'}</h2><p>${reg?'Đăng ký tài khoản trải nghiệm dành cho nhân viên.':'Đăng nhập không gian điều phối của phòng khám.'}</p></div><div class="auth-tabs"><button data-action="auth-login" class="${!reg?'active':''}">Đăng nhập</button><button data-action="auth-register" class="${reg?'active':''}">Đăng ký</button></div><form id="auth-form" class="stack gap16">${reg?field('auth-name','Họ và tên','','text','required autocomplete="name"'):''}${field('auth-email','Địa chỉ email','','email','required autocomplete="email"')}${field('auth-password','Mật khẩu','','password','required minlength="6" autocomplete="'+(reg?'new-password':'current-password')+'"')}${reg?`<div class="inline-alert blue">${ico('info')}Đăng ký bản demo chỉ cấp góc nhìn nhân viên. Phân vai Owner/Lead do Chủ phòng khám quản lý khi triển khai thực tế.</div>`:''}<button class="btn btn-primary btn-xl btn-block" type="submit">${reg?'Tạo tài khoản':'Đăng nhập'} ${ico('arrow')}</button></form><div class="auth-bottom"><div class="row between"><strong class="small">Dùng thử nhanh theo vai trò</strong><span class="status green">Dữ liệu giả lập</span></div><div class="demo-accounts">${[['owner','shield','Chủ phòng khám'],['lead','calendar','Lead điều phối'],['staff','user','Nhân viên']].map(([r,i,n])=>`<button class="demo-account" data-action="quick-login" data-role="${r}"><span class="icon">${ico(i,19)}</span><strong>${n}</strong></button>`).join('')}</div><div class="auth-hint">${ico('lock')} Tài khoản mẫu sử dụng mật khẩu <strong>123456</strong>. Xác thực chỉ mô phỏng bằng localStorage; <strong>không an toàn cho môi trường thật</strong>.</div></div></div></div></div>`;
}
function render(){if(!session||!currentUser()){session=null;persistSession();renderAuth();return;}if(!allowed(ui.view))ui.view=role()==='staff'?'dashboard':'dashboard';
 const user=currentUser();let nav=navItems().map(g=>`<div class="nav-group-title">${g.title}</div>${g.items.map(([key,icon,label])=>`<button class="nav-btn ${ui.view===key?'active':''}" data-action="navigate" data-view="${key}">${ico(icon)}<span>${label}</span>${key==='operation'&&role()==='lead'?`<span class="number-pill" style="margin-left:auto;background:#4e766a;color:white">${dayVisits(vnDate()).filter(v=>v.status==='planned').length}</span>`:''}</button>`).join('')}`).join('');
 let page=({dashboard:renderDashboard,operation:renderOperation,patients:renderPatients,staff:renderStaff,resources:renderResources,procedures:renderProcedures,reports:renderReports,audit:renderAudit,tasks:renderTasks,settings:renderSettings})[ui.view]||renderDashboard;
 let notif=alerts();document.getElementById('app').innerHTML=`<div class="shell">${ui.sideOpen?'<div class="sidebar-overlay" data-action="toggle-sidebar"></div>':''}<aside class="sidebar ${ui.sideOpen?'open':''}"><div class="sidebar-brand"><div class="brand-icon">${ico('logo',23)}</div><div><strong>ClinicFlow</strong><span>Clinical operations studio</span></div></div><div style="overflow:auto;min-height:0;padding-bottom:10px">${nav}</div><div class="side-spacer"></div><div class="side-callout"><strong>${ico('shield')} Bản mẫu nghiệp vụ</strong><p>Dữ liệu giả lập. Không thay thế y lệnh, bệnh án hay hệ thống HIS.</p><button class="small-link" data-action="navigate" data-view="${allowed('reports')?'reports':'tasks'}">Tìm hiểu chức năng ${ico('arrow',13)}</button></div><div class="side-user">${avatar(user.name)}<div class="flex1"><strong style="font-size:12px;display:block;color:#fff">${esc(user.name)}</strong><small style="color:#accdc0;font-size:10px">${esc(ROLES[role()])}</small></div><button class="btn btn-ghost" style="color:#bad9c8" title="Đăng xuất" data-action="logout">${ico('exit')}</button></div></aside><div class="main"><header class="topbar"><div class="row"><button class="circle-btn mobile-menu" data-action="toggle-sidebar">${ico('menu')}</button><div class="topbar-left"><div class="crumb"><span>Workspace</span> ${ico('chev',12)} <strong>${esc(pageLabel(ui.view))}</strong></div><span class="muted tiny">${esc(data.clinic.name)} &nbsp; · &nbsp; ${dateLong(vnDate())}</span></div></div><div class="topbar-right"><span class="date-chip">${ico('clock',14)} <span id="top-clock">${hm(nowMinute())}</span> ICT</span><select class="role-select" id="role-switch" title="Chuyển góc nhìn demo">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${role()===k?'selected':''}>${esc(v)}</option>`).join('')}</select><button class="circle-btn" title="Thông báo" data-action="show-notifications">${ico('bell')}${notif.length?'<i class="dot"></i>':''}</button><button class="circle-btn" title="Tài khoản" data-action="show-account">${ico('user')}</button></div></header><main class="content"><div class="notice-banner">${ico('info',14)} <strong>DEMO · DỮ LIỆU GIẢ</strong> — Đổi vai trò trên thanh công cụ để xem từng góc nhìn. Thời lượng thủ thuật chỉ là thông số mẫu, cần được người phụ trách chuyên môn phê duyệt.</div>${page()}<div class="footer-note">ClinicFlow Prototype 2.0 · Local-first demo · Không phải hồ sơ bệnh án điện tử được chứng nhận</div></main></div></div>`;
}
function alerts(){let d=vnDate(),n=nowMinute(),out=[];data.visits.filter(v=>v.date===d&&v.status==='in_progress').forEach(v=>{let t=timeline(v);if(t.end-n<=5&&t.end-n>=-120)out.push({type:'amber',title:`${getPatient(v.patientId)?.name}: dự kiến kết thúc ${hm(t.end)}`,desc:`${getBed(v.bedId)?.name} · cần hoàn tất và dọn giường.`});});data.cleanups.filter(c=>c.status==='pending').forEach(c=>out.push({type:'amber',title:`${getBed(c.bedId)?.name} cần dọn`,desc:`Phiếu ${c.visitId} · xác nhận vệ sinh trước lượt mới.`}));if(data.beds.some(b=>b.status==='maintenance'))out.push({type:'gray',title:'Có giường đang bảo trì',desc:'Kiểm tra lại tình trạng tài nguyên trước khi xếp lịch.'});return out;}
function dashStats(date=vnDate()){let v=dayVisits(date),activeStaff=data.staff.filter(s=>s.status==='active').length,availableBeds=data.beds.filter(b=>b.status==='active').length,usedBeds=new Set(v.map(x=>x.bedId)).size,totalProc=v.reduce((n,x)=>n+x.procIds.length,0);return {v,activeStaff,availableBeds,usedBeds,totalProc,complete:v.filter(x=>x.status==='completed').length,planned:v.filter(x=>x.status==='planned').length,ongoing:v.filter(x=>x.status==='in_progress').length,bedUtil:Math.round(v.reduce((n,x)=>n+timeline(x).total,0)/(Math.max(1,availableBeds)*11*60)*100)};}
function metric(icon,label,value,foot,color=''){return `<div class="card metric"><div class="metric-top">${esc(label)}<span class="metric-icon ${color}">${ico(icon)}</span></div><div class="metric-value mono">${esc(value)}</div><div class="metric-footer">${foot}</div></div>`;}
function renderDashboard(){const r=role(),s=dashStats(),d=vnDate();let owner=r==='owner',staff=r==='staff',my=staff?dayVisits(d).filter(v=>v.staffId===currentUser().staffId):s.v;let b=data.beds,days=[-5,-4,-3,-2,-1,0].map(i=>({date:dateAdd(d,i),count:dayVisits(dateAdd(d,i)).length}));let max=Math.max(5,...days.map(x=>x.count));
 return `<div class="page-header"><div><span class="section-label">${owner?'CHỦ SỞ HỮU / OPERATIONS':'TỔNG QUAN NGÀY LÀM VIỆC'}</span><h1>${owner?'Trung tâm vận hành phòng khám':staff?'Lịch làm việc của bạn':'Bàn điều phối hôm nay'}</h1><p>${owner?'Theo dõi hiệu suất, tài nguyên và các điểm cần xử lý.':staff?'Các lượt được phân công và công việc cần hoàn tất.':'Tình trạng giường, lịch điều trị và năng lực nhân viên theo thời gian thực (demo).'}</p></div><div class="page-actions">${!staff?btn('navigate',`${ico('report')} Xem báo cáo`,'btn-outline','data-view="reports"'):''}${isLead()?btn('new-visit',`${ico('plus')} Xếp lịch mới`,'btn-primary'):''}</div></div>
 <div class="welcome"><div style="z-index:1"><small>${esc(ROLES[r])} · ${dateLong(d)}</small><h2>${owner?'Một góc nhìn. Toàn bộ phòng khám.':staff?'Chúc bạn một ca trực thuận lợi.':'Mỗi bệnh nhân, một lịch trình liền mạch.'}</h2><p>${owner?'Nắm toàn bộ lượt điều trị, nguồn lực và nhật ký hoạt động.':staff?'Theo dõi nhiệm vụ, thời gian hoàn thành và báo cáo thao tác.':'Chọn đúng nhân viên, giường phù hợp và tối ưu thời gian trống.'}</p></div>${owner?btn('navigate',`Báo cáo quản trị ${ico('arrow')}`,'btn-outline','data-view="reports"'):staff?btn('navigate',`Xem lịch của tôi ${ico('arrow')}`,'btn-outline','data-view="tasks"'):btn('new-visit',`Xếp lịch điều trị ${ico('arrow')}`,'btn-outline')}</div>
 <div class="grid4 mt16">${metric('users',staff?'Lượt của tôi':'Lượt điều trị hôm nay',staff?my.length:s.v.length,`<b>${staff?my.filter(x=>x.status==='completed').length:s.complete}</b> đã hoàn thành`)}${metric('bed','Giường sẵn sàng',`${b.filter(x=>bedStatus(x)==='free').length}/${b.length}`,`${b.filter(x=>bedStatus(x)==='maint').length} đang bảo trì`,'blue')}${metric('user','Nhân viên trong ca',`${s.activeStaff}/${data.staff.length}`,`<b>${data.staff.length-s.activeStaff}</b> không sẵn sàng`)}${metric('calendar',staff?'Đã hoàn thành':'Lượt chờ thực hiện',staff?my.filter(x=>x.status==='completed').length:s.planned,`<b>${s.ongoing}</b> đang thực hiện`,'amber')}</div>
 <div class="grid-main mt16"><div class="stack"><section class="card card-pad"><div class="card-head"><div><div class="card-title">Sơ đồ sử dụng giường</div><p class="card-sub">10 giường · Tình trạng hiện tại · Chọn giường để xem chi tiết</p></div><button class="btn btn-sm btn-outline" data-action="navigate" data-view="resources">Quản lý ${ico('chev',12)}</button></div><div class="bed-grid">${b.map(z=>{let st=bedStatus(z);return `<button class="bed-tile ${st==='maint'?'maint':st==='busy'?'busy':st==='cleaning'?'cleaning':''}" data-action="bed-detail" data-id="${z.id}">${ico('bed',25)}<span>${esc(z.name)}</span><small>${st==='free'?'Trống':st==='busy'?'Đang dùng':st==='maint'?'Bảo trì':'Chờ dọn'}</small></button>`;}).join('')}</div><div class="legend"><span><i></i> Sẵn sàng</span><span><i class="busy"></i> Đang sử dụng</span><span><i class="cleaning"></i> Cần dọn</span><span><i class="maint"></i> Bảo trì</span></div></section>
 <section class="card card-pad"><div class="card-head"><div><div class="card-title">Lịch điều trị trong ngày</div><p class="card-sub">Danh sách các lượt đã xếp theo giờ bắt đầu</p></div><button class="btn btn-sm btn-outline" data-action="navigate" data-view="${staff?'tasks':'operation'}">Xem tất cả ${ico('chev',12)}</button></div>${my.filter(v=>v.status!=='cancelled').sort((a,b)=>minute(a.start)-minute(b.start)).slice(0,6).map(v=>`<div class="queue-item"><div class="queue-time mono">${esc(v.start)}</div><div class="queue-avatar">${esc(initials(getPatient(v.patientId)?.name))}</div><div class="queue-info"><strong>${esc(getPatient(v.patientId)?.name||v.patientId)}</strong><p>${esc(procName(v.procIds))} · ${esc(getStaff(v.staffId)?.name||'')} · ${esc(getBed(v.bedId)?.name||'')}</p></div>${pill(v.status)}</div>`).join('')||empty('calendar','Chưa có lịch','Chọn Xếp lịch mới để thêm lượt điều trị.')}</section></div>
 <div class="stack">${owner?`<section class="card card-pad"><div class="card-head"><div><div class="card-title">Xu hướng lượt điều trị</div><p class="card-sub">6 ngày gần nhất · Dữ liệu minh họa</p></div>${ico('activity')}</div><div class="chart-bars">${days.map(x=>`<div class="chart-col"><div class="bar" style="height:${Math.max(3,Math.round(x.count/max*140))}px"></div><small>${x.date.slice(8,10)}/${x.date.slice(5,7)}</small></div>`).join('')}</div><div class="row between mt16"><span class="muted small">Tổng số lượt (${days.length} ngày)</span><strong>${days.reduce((n,x)=>n+x.count,0)}</strong></div></section>`:''}
 <section class="card card-pad"><div class="card-head"><div><div class="card-title">Tài nguyên & công suất</div><p class="card-sub">Số liệu sơ bộ cho điều phối (không phải chỉ số hiệu quả lâm sàng)</p></div></div>${[[`Giường đã có lịch`,s.usedBeds,s.availableBeds],[`Nhân sự hoạt động`,s.activeStaff,data.staff.length],[`Thiết bị sẵn sàng`,data.devices.filter(x=>x.status==='active').length,data.devices.length]].map(([title,n,total])=>`<div class="util-row"><div class="row"><span>${esc(title)}</span><strong>${n}/${total}</strong></div><div class="progress"><i style="width:${Math.round(n/Math.max(1,total)*100)}%"></i></div></div>`).join('')}<div class="inline-alert green mt16">${ico('info')} Thời gian máy chạy không nhất thiết đồng nghĩa nhân viên bị chiếm dụng; theo quy tắc đã phê duyệt.</div></section>
 <section class="card card-pad"><div class="card-head"><div><div class="card-title">Cần chú ý</div><p class="card-sub">Thông báo từ lịch và tài nguyên</p></div><span class="chip">${alerts().length} mục</span></div>${alerts().slice(0,3).map(a=>`<div class="notification-item"><div class="notification-icon">${ico('bell')}</div><div class="flex1"><strong class="small">${esc(a.title)}</strong><p>${esc(a.desc)}</p></div></div>`).join('')||'<div class="inline-alert green">Không có cảnh báo đang chờ.</div>'}</section>
 <section class="card card-pad"><div class="card-head"><div class="card-title">Truy cập nhanh</div></div><div class="grid2" style="gap:8px">${[['patients','users','Bệnh nhân'],['procedures','sliders','Thủ thuật'],['reports','report','Báo cáo'],['tasks','clipboard','Công việc']].filter(x=>allowed(x[0])).map(([v,i,n])=>`<button class="btn btn-outline" data-action="navigate" data-view="${v}" style="justify-content:flex-start">${ico(i)} ${n}</button>`).join('')}</div></section></div></div>`;
}
function renderPatients(){let list=data.patients.filter(p=>!ui.filter||[p.name,p.id,p.externalId].join(' ').toLowerCase().includes(ui.filter.toLowerCase()));return `<div class="page-header"><div><span class="section-label">TIẾP NHẬN & TRA CỨU</span><h1>Danh sách bệnh nhân</h1><p>Dùng mã hồ sơ từ phần mềm hiện hữu. Chỉ lưu tham chiếu và lịch điều phối trong bản demo.</p></div>${btn('new-patient',`${ico('plus')} Thêm bệnh nhân`,'btn-primary')}</div><div class="card card-pad"><div class="toolbar"><div class="search">${ico('search')}<input id="page-search" placeholder="Tìm tên, mã bệnh nhân, mã HIS..." value="${esc(ui.filter)}" /></div><span class="chip">${list.length} hồ sơ</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>BỆNH NHÂN</th><th>MÃ HỒ SƠ NGOÀI</th><th>NĂM SINH</th><th>NHÂN VIÊN GẦN NHẤT</th><th>SỐ LƯỢT</th><th>THAO TÁC</th></tr></thead><tbody>${list.map(p=>`<tr><td>${nameCell(p.name,p.id)}</td><td>${esc(p.externalId)}</td><td>${esc(p.year)}</td><td>${esc(getStaff(latestStaff(p.id))?.name||'Chưa có')}</td><td><span class="number-pill">${data.visits.filter(v=>v.patientId===p.id&&v.status!=='cancelled').length}</span></td><td><div class="table-actions">${btn('new-visit',`${ico('plus')} Xếp lịch`,'btn-sm btn-light',`data-patient="${p.id}"`)}${btn('patient-detail',ico('folder'),'btn-sm btn-outline',`data-id="${p.id}"`)}${btn('edit-patient',ico('edit'),'btn-sm btn-outline',`data-id="${p.id}"`)}${btn('delete-patient',ico('trash'),'btn-sm btn-danger',`data-id="${p.id}"`)}</div></td></tr>`).join('')}</tbody></table>${list.length?'':empty('users','Không tìm thấy bệnh nhân','Thử từ khóa khác hoặc thêm hồ sơ mới.')}</div></div>`;}
function renderStaff(){let list=data.staff.filter(p=>!ui.filter||[p.name,p.id,p.position].join(' ').toLowerCase().includes(ui.filter.toLowerCase()));return `<div class="page-header"><div><span class="section-label">RESOURCE MANAGEMENT</span><h1>Nhân sự & năng lực</h1><p>Danh sách nhân viên, kỹ năng được phép thực hiện, ca làm và tình trạng phân công.</p></div>${isOwner()?btn('new-staff',`${ico('plus')} Thêm nhân viên`,'btn-primary'):''}</div><div class="grid3 mb16">${metric('user','Tổng nhân sự',data.staff.length,'Theo dữ liệu nhân sự')}${metric('check','Có thể phân công',data.staff.filter(x=>x.status==='active').length,'Đang hoạt động')}${metric('alert','Vắng mặt / Tạm ngưng',data.staff.filter(x=>x.status!=='active').length,'Cần kiểm tra trước khi xếp lịch','amber')}</div><div class="card card-pad"><div class="toolbar"><div class="search">${ico('search')}<input id="page-search" placeholder="Tìm tên nhân viên, mã, chức danh..." value="${esc(ui.filter)}" /></div><span class="chip">${list.length} nhân viên</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>NHÂN VIÊN</th><th>VỊ TRÍ</th><th>KỸ NĂNG ĐƯỢC GÁN</th><th>CA LÀM</th><th>TRẠNG THÁI</th><th>THAO TÁC</th></tr></thead><tbody>${list.map(s=>`<tr><td>${nameCell(s.name,s.id)}</td><td>${esc(s.position)}</td><td>${s.skills.map(i=>`<span class="tag">${esc(getProc(i)?.name||i)}</span>`).join('')}</td><td class="mono">${esc(s.shiftStart)}–${esc(s.shiftEnd)}</td><td>${s.status==='active'?'<span class="status green">Hoạt động</span>':'<span class="status amber">Vắng / Nghỉ</span>'}</td><td><div class="table-actions">${isOwner()?`${btn('edit-staff',ico('edit'),'btn-sm btn-outline',`data-id="${s.id}"`)}${btn('delete-staff',ico('trash'),'btn-sm btn-danger',`data-id="${s.id}"`)}`:`${btn('staff-detail',ico('info'),'btn-sm btn-outline',`data-id="${s.id}"`)}`}</div></td></tr>`).join('')}</tbody></table></div></div><div class="inline-alert mt16">${ico('shield')} Kỹ năng trong demo là dữ liệu giả định. Sản phẩm thật cần kiểm tra phạm vi hành nghề, chứng chỉ và quyết định phân công của cơ sở.</div>`;}
function renderResources(){let bedTab=ui.resourceTab==='beds',list=bedTab?data.beds:data.devices;return `<div class="page-header"><div><span class="section-label">TÀI NGUYÊN PHÒNG KHÁM</span><h1>Giường bệnh & thiết bị</h1><p>Kiểm soát tình trạng sử dụng, vệ sinh giữa lượt và bảo trì tài sản.</p></div>${isOwner()?btn(bedTab?'new-bed':'new-device',`${ico('plus')} Thêm ${bedTab?'giường':'thiết bị'}`,'btn-primary'):''}</div><div class="row between wrap mb16"><div class="seg-tabs"><button data-action="resource-tab" data-tab="beds" class="${bedTab?'active':''}">${ico('bed')} Giường bệnh</button><button data-action="resource-tab" data-tab="devices" class="${!bedTab?'active':''}">${ico('device')} Thiết bị</button></div><span class="chip">${list.length} ${bedTab?'giường':'thiết bị'}</span></div><div class="grid3 mb16">${metric(bedTab?'bed':'device','Tổng số',list.length,'Tài nguyên đã đăng ký')}${metric('check','Đang sẵn sàng',list.filter(x=>bedTab?bedStatus(x)==='free':x.status==='active').length,'Có thể cân nhắc sử dụng')}${metric('alert','Bảo trì / Cần dọn',list.filter(x=>bedTab?bedStatus(x)!=='free':x.status!=='active').length,'Cần xử lý trước khi tiếp nhận','amber')}</div><div class="card card-pad"><div class="table-wrap"><table class="data-table"><thead><tr><th>${bedTab?'GIƯỜNG':'THIẾT BỊ'}</th><th>${bedTab?'PHÒNG':'PHÂN LOẠI'}</th><th>TRẠNG THÁI</th><th>GHI CHÚ</th><th>THAO TÁC</th></tr></thead><tbody>${list.map(b=>`<tr><td><strong>${esc(b.name)}</strong><div class="cell-sub">${esc(b.id)}</div></td><td>${esc(bedTab?b.room:b.type==='electro'?'Máy điện châm':b.type==='lamp'?'Đèn hồng ngoại':b.type)}</td><td>${bedTab?pillResource(bedStatus(b)):b.status==='active'?'<span class="status green">Sẵn sàng</span>':'<span class="status red">Bảo trì</span>'}</td><td class="muted small">${esc(b.note||'—')}</td><td><div class="table-actions">${bedTab?btn('bed-detail',ico('info'),'btn-sm btn-outline',`data-id="${b.id}"`):''}${isOwner()?`${btn(bedTab?'edit-bed':'edit-device',ico('edit'),'btn-sm btn-outline',`data-id="${b.id}"`)}${btn(bedTab?'delete-bed':'delete-device',ico('trash'),'btn-sm btn-danger',`data-id="${b.id}"`)}`:''}</div></td></tr>`).join('')}</tbody></table></div></div>${bedTab?`<div class="inline-alert green mt16">${ico('check')} Nếu giường chưa xác nhận dọn sau khi hoàn thành, hệ thống chặn sử dụng lượt mới trong ngày cho đến khi xử lý.</div>`:''}`;}
function renderOperation(){let date=ui.operationDate,visits=dayVisits(date),time=ui.scheduleMode==='timeline',stats=dashStats(date);return `<div class="page-header"><div><span class="section-label">ĐIỀU PHỐI LỊCH HẸN · LIVE DEMO</span><h1>Lịch điều trị & phân công</h1><p>Team Lead lựa chọn bệnh nhân, thủ thuật, nhân viên, giường và máy. Hệ thống kiểm tra xung đột từng giai đoạn.</p></div><div class="page-actions">${btn('find-slot',`${ico('spark')} Gợi ý lịch trống`,'btn-outline')}${btn('new-visit',`${ico('plus')} Xếp lịch điều trị`,'btn-primary')}</div></div><div class="card card-pad mb16"><div class="toolbar" style="margin:0"><div class="row wrap"><div class="field" style="max-width:190px"><label>Ngày điều phối</label><input type="date" id="operation-date" value="${date}" /></div><div class="seg-tabs" style="align-self:end"><button data-action="mode" data-mode="table" class="${!time?'active':''}">${ico('calendar')} Danh sách</button><button data-action="mode" data-mode="timeline" class="${time?'active':''}">${ico('activity')} Timeline</button></div></div><div class="row wrap" style="margin-top:16px"><span class="chip">${visits.length} lượt</span><span class="status blue">${stats.planned} đã lên lịch</span><span class="status green">${stats.ongoing} đang làm</span><span class="status gray">${stats.complete} hoàn thành</span></div></div></div>
 ${time?`<div class="card card-pad"><div class="card-head"><div><div class="card-title">Lịch sử dụng giường · 07:00–19:00</div><p class="card-sub">Mỗi thanh thể hiện một lượt chiếm dụng giường; nhấn vào để xem chi tiết.</p></div><div class="schedule-legend"><span><i class="p"></i>Đã lên lịch</span><span><i></i>Đang thực hiện</span><span><i class="c"></i>Dọn giường</span></div></div><div class="calendar-scroll"><div class="calendar"><div class="timeline-head"><span class="timeline-label">GIƯỜNG</span><div class="timeline-hours">${Array.from({length:12},(_,i)=>`<span>${pad(i+7)}:00</span>`).join('')}</div></div>${data.beds.map(b=>`<div class="timeline-row"><div class="timeline-label">${esc(b.name)}<small>${esc(b.room.replace('Phòng trị liệu ','Phòng '))}</small></div><div class="timeline-track">${visits.filter(v=>v.bedId===b.id).map(v=>{let t=timeline(v),start=Math.max(0,(t.start-420)/720*100),w=Math.max(1,Math.min(100-start,t.total/720*100)),cleanstart=(t.end-420)/720*100,cleanw=data.settings.cleanup/720*100;return `<button title="${esc(getPatient(v.patientId)?.name)} · ${esc(procName(v.procIds))}" class="slot ${v.status}" data-action="visit-detail" data-id="${v.id}" style="left:${start}%;width:${w}%">${esc(v.start)} ${esc(getPatient(v.patientId)?.name?.replace('BN DEMO • ','')||'')}</button><span class="slot cleaning" title="Dọn giường ${data.settings.cleanup} phút" style="left:${Math.max(0,cleanstart)}%;width:${Math.max(0.8,cleanw)}%;padding:0"></span>`;}).join('')}</div></div>`).join('')}</div></div><p class="calendar-note">Mô phỏng 10 giường; phút vệ sinh được giữ chỗ sau mỗi lượt. Nhân viên có thể được phân công lượt khác khi máy đang chạy nếu không vi phạm ràng buộc chuyên môn.</p></div>`:`<div class="card card-pad"><div class="card-head"><div><div class="card-title">Danh sách lịch điều trị</div><p class="card-sub">Nhấn vào một lượt để xem các giai đoạn thủ thuật và thao tác cập nhật.</p></div><span class="chip">${visits.length} lịch</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>GIỜ / THỜI LƯỢNG</th><th>BỆNH NHÂN</th><th>THỦ THUẬT</th><th>NHÂN VIÊN</th><th>GIƯỜNG / MÁY</th><th>TRẠNG THÁI</th><th>THAO TÁC</th></tr></thead><tbody>${visits.map(v=>{let t=timeline(v);return `<tr><td><strong class="mono">${esc(v.start)}–${hm(t.end)}</strong><div class="cell-sub">${t.total} phút điều trị</div></td><td>${nameCell(getPatient(v.patientId)?.name||'?',v.patientId)}</td><td><div class="cell-title">${esc(procName(v.procIds))}</div>${v.overlap?'<div class="cell-sub">Có kết hợp song song được cấu hình</div>':''}</td><td>${esc(getStaff(v.staffId)?.name||'—')}</td><td>${esc(getBed(v.bedId)?.name||'—')}<div class="cell-sub">${esc(getDevice(v.deviceId)?.name||'Không dùng máy')}</div></td><td>${pill(v.status)}</td><td><div class="table-actions">${btn('visit-detail',ico('info'),'btn-sm btn-outline',`data-id="${v.id}"`)}${v.status==='planned'?btn('start-visit',`${ico('check')} Bắt đầu`,'btn-sm btn-light',`data-id="${v.id}"`):v.status==='in_progress'?btn('complete-visit',`${ico('check')} Kết thúc`,'btn-sm btn-light',`data-id="${v.id}"`):''}${v.status==='planned'?btn('edit-visit',ico('edit'),'btn-sm btn-outline',`data-id="${v.id}"`):''}</div></td></tr>`;}).join('')}</tbody></table>${visits.length?'':empty('calendar','Chưa có lịch trong ngày này','Hãy tạo một lịch mới hoặc chuyển sang ngày khác.')}</div></div>`}
 <div class="grid2 mt16"><div class="card card-pad"><div class="card-head"><div><div class="card-title">Thủ tục vệ sinh sau điều trị</div><p class="card-sub">Hoàn thành điều trị → dọn giường → xác nhận sẵn sàng</p></div></div>${data.cleanups.filter(c=>c.status==='pending').map(c=>`<div class="list-card mb10"><span class="metric-icon amber">${ico('bed')}</span><div class="flex1"><h4>${esc(getBed(c.bedId)?.name)} · ${esc(c.visitId)}</h4><p>Chờ xác nhận vệ sinh, định mức ${data.settings.cleanup} phút</p></div>${btn('finish-cleanup','Xác nhận đã dọn','btn-sm btn-primary',`data-id="${c.id}"`)}</div>`).join('')||'<div class="inline-alert green">Không có giường đang chờ xác nhận dọn.</div>'}</div><div class="card card-pad"><div class="card-head"><div><div class="card-title">Quy trình vận hành đề xuất</div></div><div class="stack gap8">${['1. Tiếp nhận hồ sơ và chỉ định hợp lệ','2. Chọn thủ thuật và kiểm tra cấu hình','3. Ưu tiên người phụ trách lần gần nhất nếu rảnh','4. Chọn giường/máy không xung đột','5. Theo dõi, kết thúc và xác nhận vệ sinh'].map((s,i)=>`<div class="row"><span class="number-pill">${i+1}</span><span class="small">${esc(s.split('. ')[1])}</span></div>`).join('')}</div></div></div>`;}
function renderProcedures(){let rules=ui.procTab==='rules';return `<div class="page-header"><div><span class="section-label">DYNAMIC PROCEDURE ENGINE</span><h1>Thủ thuật & cấu hình thời gian</h1><p>Thêm thủ thuật mới bằng dữ liệu; chia giai đoạn trực tiếp, thời gian máy và tài nguyên sử dụng.</p></div>${isOwner()?btn(rules?'save-rules':'new-procedure',`${ico(rules?'check':'plus')} ${rules?'Lưu quy tắc':'Thêm thủ thuật'}`,'btn-primary',rules?'form="rules-form"':''):''}</div><div class="row between wrap mb16"><div class="seg-tabs"><button data-action="proc-tab" data-tab="catalog" class="${!rules?'active':''}">${ico('clipboard')} Danh mục thủ thuật</button><button data-action="proc-tab" data-tab="rules" class="${rules?'active':''}">${ico('sliders')} Quy tắc toàn phòng khám</button></div><span class="chip">${data.procedures.filter(p=>p.active).length}/${data.procedures.length} đang kích hoạt</span></div>
 ${rules?`<div class="grid-main"><section class="card card-pad"><div class="card-head"><div><div class="card-title">Bộ quy tắc điều phối</div><p class="card-sub">Tất cả giá trị là cấu hình bản demo, phải được phê duyệt phù hợp quy trình chuyên môn.</p></div>${ico('settings')}</div><form id="rules-form"><div class="rule-item"><div><strong>Khoảng cách giữa hai thủ thuật</strong><p>Phút chuyển tiếp khi thực hiện tuần tự trên cùng bệnh nhân</p></div><input type="number" name="gapProcedures" min="0" max="60" value="${data.settings.gapProcedures}" ${!isOwner()?'disabled':''}></div><div class="rule-item"><div><strong>Khoảng cách giữa hai lượt người bệnh</strong><p>Phút nhân viên chuyển đổi sang bệnh nhân khác</p></div><input type="number" name="gapPatients" min="0" max="60" value="${data.settings.gapPatients}" ${!isOwner()?'disabled':''}></div><div class="rule-item"><div><strong>Thời gian vệ sinh giường</strong><p>Giường tiếp tục bị giữ sau khi kết thúc thủ thuật</p></div><input type="number" name="cleanup" min="0" max="120" value="${data.settings.cleanup}" ${!isOwner()?'disabled':''}></div><div class="rule-item"><div><strong>Cho phép ghép thủ thuật đã phê duyệt</strong><p>Chỉ các cặp đã khai báo tương thích mới được chồng lấp</p></div><label class="switch"><input type="checkbox" name="allowOverlap" ${data.settings.allowOverlap?'checked':''} ${!isOwner()?'disabled':''}><span></span></label></div><div class="rule-item"><div><strong>Giải phóng nhân viên khi máy chạy</strong><p>Chỉ áp dụng nếu đã xác nhận quy trình theo dõi, giám sát an toàn</p></div><label class="switch"><input type="checkbox" name="allowMachineRelease" ${data.settings.allowMachineRelease?'checked':''} ${!isOwner()?'disabled':''}><span></span></label></div><div class="rule-item"><div><strong>Bắt đầu phục vụ</strong><p>Giờ hoạt động đầu ngày</p></div><input type="time" name="workStart" value="${data.settings.workStart}" ${!isOwner()?'disabled':''}></div><div class="rule-item"><div><strong>Kết thúc phục vụ</strong><p>Giờ đóng cửa, bao gồm thời gian dọn</p></div><input type="time" name="workEnd" value="${data.settings.workEnd}" ${!isOwner()?'disabled':''}></div><div class="mt16">${isOwner()?'<button type="submit" class="btn btn-primary">Lưu bộ quy tắc</button>':'<span class="muted small">Chỉ Chủ phòng khám có quyền thay đổi cấu hình.</span>'}</div></form></section><section class="stack"><div class="card card-pad"><div class="card-head"><div class="card-title">Giải thích nguyên tắc xếp lịch</div>${ico('info')}</div><div class="stack gap8">${['Ràng buộc cứng: không trùng nhân viên khi trực tiếp làm việc.','Ràng buộc cứng: một giường không phục vụ hai bệnh nhân cùng lúc.','Ràng buộc cứng: một máy không được cấp cho hai người cùng lúc.','Ưu tiên mềm: nhân viên đã chăm sóc bệnh nhân lần trước.','Không thay đổi chỉ định điều trị hoặc quyết định chuyên môn.'].map((s,i)=>`<div class="row align-start"><span class="number-pill">${i+1}</span><p class="small">${s}</p></div>`).join('')}</div></div><div class="inline-alert">${ico('alert')} Thay đổi quy tắc có thể làm các lịch đã xếp không còn hợp lệ. Prototype lưu nhật ký và yêu cầu rà soát lịch sau khi sửa; bản production cần version hóa quy tắc theo lịch sử.</div></section></div>`:
 `<div class="grid2">${data.procedures.map(p=>`<div class="card card-pad"><div class="row between"><span class="chip">${esc(p.code)}</span>${p.approved?'<span class="status green">Đã phê duyệt (demo)</span>':'<span class="status amber">Chưa phê duyệt</span>'}</div><div class="row mt16" style="align-items:flex-start"><div class="metric-icon" style="background:${p.color}22;color:${p.color}">${ico('activity')}</div><div class="flex1"><h3>${esc(p.name)}</h3><p class="muted small">${esc(p.category)} · ${p.steps.length} giai đoạn · ${phaseTime(p)} phút cơ bản</p></div></div><div class="divider"></div>${p.steps.map((st,i)=>`<div class="row between mb10"><div class="row gap8"><span class="number-pill">${i+1}</span><div><div class="small bold">${esc(st.name)}</div><div class="tiny muted">${st.staff?'Có nhân viên':'Không giữ nhân viên'} · ${st.bed?'Có giường':''}${st.device?' · Có máy':''}</div></div></div><strong>${st.duration}p</strong></div>`).join('')}<div class="row between mt16"><span class="status ${p.active?'green':'gray'}">${p.active?'Đang sử dụng':'Tạm tắt'}</span><div class="table-actions">${isOwner()?`${btn('edit-procedure',`${ico('edit')} Cấu hình`,'btn-sm btn-outline',`data-id="${p.id}"`)}${btn('delete-procedure',ico('trash'),'btn-sm btn-danger',`data-id="${p.id}"`)}`:btn('view-procedure','Xem thông số','btn-sm btn-outline',`data-id="${p.id}"`)}</div></div></div>`).join('')}</div><div class="inline-alert green mt16">${ico('info')} Mô hình nhiều giai đoạn hỗ trợ thêm thủ thuật không cần hardcode; mọi thời lượng và điều kiện phối hợp phải được xác nhận bởi người chịu trách nhiệm chuyên môn.</div>`}`;
}
function renderTasks(){
 let date=ui.operationDate,selected=role()==='staff'?currentUser()?.staffId:'';
 let list=dayVisits(date).filter(v=>!selected||v.staffId===selected);
 return `<div class="page-header"><div><span class="section-label">MY WORKSPACE</span><h1>${role()==='staff'?'Lịch điều trị của tôi':'Bảng công việc điều trị'}</h1><p>Thông tin bệnh nhân, thủ thuật, nhân viên phụ trách và tiến độ mỗi lượt được phân công.</p></div><div class="page-actions"><input type="date" class="select-inline" id="operation-date" value="${date}"/></div></div>
 <div class="grid3 mb16">${metric('calendar','Lượt được giao',list.length,'Theo ngày đang xem')}${metric('check','Đã hoàn tất',list.filter(x=>x.status==='completed').length,'Xong thao tác điều trị')}${metric('clock','Chưa hoàn tất',list.filter(x=>!['completed','cancelled'].includes(x.status)).length,'Đã lên lịch hoặc đang thực hiện','amber')}</div>
 <div class="stack">${list.map(v=>{let t=timeline(v);return `<div class="card card-pad task-treatment-card"><div class="row between wrap"><div class="row"><div class="metric-icon">${ico('clock')}</div><div><h3>${esc(v.start)} – ${hm(t.end)} <span class="muted tiny">(${t.total} phút)</span></h3><p class="muted small">Mã lượt ${esc(v.id)} · ${dateLong(v.date)}</p></div></div>${pill(v.status)}</div>
 ${patientTaskSummary(v)}

function procedureModal(p){let edit=!!p;p=clone(p||{id:'',name:'',code:'',category:'Châm cứu',deviceType:'',active:true,approved:false,color:'#278b74',steps:[{name:'Thực hiện trực tiếp',duration:15,staff:true,bed:true,device:false}],overlapWith:[]});showModal(edit?'Cấu hình thủ thuật':'Thêm thủ thuật mới','Mỗi giai đoạn xác định riêng nhân viên, giường, máy và thời lượng.',`<form id="procedure-form" class="stack gap16"><div class="form-grid">${field('pr-name','Tên thủ thuật',p.name,'text','required')}${field('pr-code','Mã nội bộ',p.code,'text','required')}${selectField('pr-category','Nhóm thủ thuật',[['Châm cứu','Châm cứu'],['Trị liệu','Trị liệu'],['Vật lý trị liệu','Vật lý trị liệu'],['Khác','Khác']],p.category)}${selectField('pr-device','Loại thiết bị dùng nếu cần',[['','Không cần thiết bị'],['electro','Máy điện châm'],['lamp','Đèn hồng ngoại'],['other','Thiết bị khác']],p.deviceType)}<div class="field"><label>Trạng thái</label><label class="check-row" style="padding-top:9px"><input type="checkbox" id="pr-active" ${p.active?'checked':''}> Kích hoạt thủ thuật</label></div><div class="field"><label>Phê duyệt quy trình (demo)</label><label class="check-row" style="padding-top:9px"><input type="checkbox" id="pr-approved" ${p.approved?'checked':''}> Đã được chuyên môn phê duyệt</label></div></div><div><div class="row between mb10"><strong class="small">Các giai đoạn thực hiện</strong>${btn('add-step',`${ico('plus')} Thêm bước`,'btn-sm btn-outline')}</div><div class="step-row step-head"><span>Tên giai đoạn</span><span>Phút</span><label>NV</label><label>Giường</label><label>Máy</label><span></span></div><div id="step-list">${p.steps.map((st,i)=>stepRow(st,i)).join('')}</div><p class="tiny muted">NV = nhân viên trực tiếp; các tài nguyên được xem là bận trong toàn bộ thời gian bước đó.</p></div><div><strong class="small">Thủ thuật được phép kết hợp trong giai đoạn không giữ nhân viên</strong><div class="check-list mt8">${data.procedures.filter(x=>x.id!==p.id).map(x=>`<label class="check-row"><input name="overlapWith" type="checkbox" value="${x.id}" ${p.overlapWith.includes(x.id)?'checked':''}>${esc(x.name)}</label>`).join('')||'<small>Chưa có thủ thuật khác.</small>'}</div></div><input type="hidden" name="editId" value="${esc(p.id)}"></form>`,`${btn('close-modal','Hủy','btn-outline')}<button form="procedure-form" class="btn btn-primary">${edit?'Lưu cấu hình':'Tạo thủ thuật'}</button>`,true);}
function stepRow(st,i){return `<div class="step-row" data-step-row="1"><input type="text" class="step-name" value="${esc(st.name)}" placeholder="Tên giai đoạn" required><input class="step-duration" type="number" min="1" max="300" value="${esc(st.duration)}" required><label class="step-check"><input class="step-staff" type="checkbox" ${st.staff?'checked':''} title="Cần nhân viên"/></label><label class="step-check"><input class="step-bed" type="checkbox" ${st.bed?'checked':''} title="Chiếm giường"/></label><label class="step-check"><input class="step-device" type="checkbox" ${st.device?'checked':''} title="Chiếm thiết bị"/></label><button type="button" class="btn btn-sm btn-ghost" data-action="remove-step" title="Xóa bước">${ico('trash')}</button></div>`;}
function readVisitForm(){let f=document.getElementById('visit-form');if(!f)return null;const g=n=>f.elements.namedItem(n)?.value||'';return {id:g('editId'),patientId:g('patientId'),date:g('date'),start:g('start'),procIds:[...f.querySelectorAll('input[name="procIds"]:checked')].map(x=>x.value),staffId:g('staffId'),bedId:g('bedId'),deviceId:g('deviceId'),overlap:!!f.elements.namedItem('overlap')?.checked,orderConfirmed:!!f.elements.namedItem('orderConfirmed')?.checked,notes:g('notes'),status:g('status')||'planned'};}
function visitModal(v=null,patientId=''){
 let edit=!!v;v=clone(v||{id:'',patientId:patientId||'',date:ui.operationDate,start:'09:00',procIds:['diencham'],staffId:'',bedId:'',deviceId:'',overlap:false,orderConfirmed:false,notes:'',status:'planned'});
 let first=v.staffId||latestStaff(v.patientId);if(!v.staffId&&first)v.staffId=first;
 showModal(edit?'Điều chỉnh lịch điều trị':'Tạo lượt điều trị & phân công','Team Lead xác nhận chỉ định, chọn phương pháp và nhận gợi ý xếp lịch.',`<form id="visit-form" class="stack gap16"><div class="form-grid">${selectField('patientId','Bệnh nhân',[['','— Chọn bệnh nhân —'],...data.patients.filter(p=>p.status==='active').map(p=>[p.id,`${p.name} · ${p.externalId}`])],v.patientId,'required')}${field('date','Ngày điều trị',v.date,'date','required')}${field('start','Giờ bắt đầu',v.start,'time','required')}${selectField('staffId','Nhân viên phụ trách',[['','— Chọn nhân viên —'],...data.staff.map(s=>[s.id,`${s.name}${s.status!=='active'?' (vắng)':''}`])],v.staffId,'')}${selectField('bedId','Giường điều trị',[['','— Chọn giường —'],...data.beds.map(b=>[b.id,`${b.name} (${b.room})`])],v.bedId,'')}${selectField('deviceId','Thiết bị',[['','— Không sử dụng —'],...data.devices.map(x=>[x.id,x.name])],v.deviceId,'')}</div>
 <div><strong class="small">Phương pháp điều trị / thủ thuật</strong><div class="picker-list mt8">${data.procedures.filter(p=>p.active||v.procIds.includes(p.id)).map(p=>`<label class="pick-card ${v.procIds.includes(p.id)?'checked':''}"><input type="checkbox" name="procIds" value="${p.id}" ${v.procIds.includes(p.id)?'checked':''} ${!p.approved?'disabled':''}/><span><b>${esc(p.name)}</b><small>${phaseTime(p)} phút · ${p.approved?'Đã phê duyệt demo':'Chưa phê duyệt'}</small></span></label>`).join('')}</div></div>
 <label class="check-row"><input type="checkbox" name="overlap" ${v.overlap?'checked':''}>Cho phép kết hợp các thủ thuật được cấu hình tương thích (ví dụ Điện châm + Cứu)</label><label class="check-row"><input type="checkbox" name="orderConfirmed" ${v.orderConfirmed?'checked':''}><strong>Đã đối chiếu có chỉ định/y lệnh chuyên môn hợp lệ</strong></label>
 <div class="field"><label>Ghi chú cho điều phối (không phải bệnh án)</label><textarea name="notes" placeholder="Lưu ý vận hành...">${esc(v.notes||'')}</textarea></div><input name="editId" type="hidden" value="${esc(v.id)}"><input name="status" type="hidden" value="${esc(v.status)}"><div id="visit-recommendation"></div></form>`,`${btn('close-modal','Hủy','btn-outline')}${btn('auto-pick',`${ico('spark')} Tự chọn phương án`,'btn-outline')}<button form="visit-form" type="submit" class="btn btn-primary">${edit?'Lưu lịch':'Xác nhận xếp lịch'}</button>`,true);
 refreshVisitRecommendation();
}
function findCandidateOptions(base,excludeId){let candidates=[],recent=latestStaff(base.patientId,excludeId);if(!validProcIds(base.procIds))return {candidates,recent};let people=data.staff.filter(s=>s.status==='active'&&s.licenseStatus==='Đã xác minh nội bộ'&&base.procIds.every(p=>s.skills.includes(p)));let beds=data.beds.filter(b=>b.status==='active');let devices=requiresDevice(base.procIds)?data.devices.filter(d=>d.status==='active'&&d.type===deviceType(base.procIds)):[{id:''}];
 for(let s of people){let got=null;for(let b of beds){for(let d of devices){let c={...base,staffId:s.id,bedId:b.id,deviceId:d.id,orderConfirmed:true};if(validate(c,{excludeId}).ok){got=c;break;}}if(got)break;}if(got)candidates.push({staff:s,bed:getBed(got.bedId),device:getDevice(got.deviceId),candidate:got,preferred:s.id===recent,load:staffWorkMinutes(s.id,base.date)});}
 candidates.sort((a,b)=>Number(b.preferred)-Number(a.preferred)||a.load-b.load);return {candidates,recent};}
function refreshVisitRecommendation(){let box=document.getElementById('visit-recommendation'),v=readVisitForm();if(!box||!v)return;let form=document.getElementById('visit-form');form.querySelectorAll('.pick-card').forEach(l=>l.classList.toggle('checked',l.querySelector('input')?.checked));let recent=latestStaff(v.patientId,v.id);let res=findCandidateOptions(v,v.id);let check=(v.staffId&&v.bedId)?validate(v,{excludeId:v.id}):null;let rec=res.candidates.slice(0,4);
 box.innerHTML=`<div class="recommend"><div class="row between"><h4>${ico('spark')} Gợi ý phân công thông minh</h4><span class="chip">${rec.length} phương án khả thi</span></div>${recent?`<p><strong>Ưu tiên nhân viên gần nhất:</strong> ${esc(getStaff(recent)?.name||recent)} · ${rec.some(x=>x.preferred)?'<span style="color:#25815d">Rảnh và đủ điều kiện</span>':'<span style="color:#bd6a4c">Không rảnh/không đủ tài nguyên tại giờ chọn</span>'}</p>`:'<p>Bệnh nhân chưa có lịch sử; ưu tiên nhân viên ít công việc hơn.</p>'}
 ${rec.length?`<div class="rec-list">${rec.map((r,i)=>`<button type="button" class="rec-chip" data-action="apply-recommendation" data-index="${i}">${r.preferred?'★ ':''}${esc(r.staff.name)} <em>· ${esc(r.bed.name)}${r.device?' · '+esc(r.device.name):''}</em></button>`).join('')}</div>`:`<p style="color:#a45a4b">Không tìm thấy tổ hợp nhân sự–giường–máy ở thời gian này. Thử đổi giờ, thủ thuật hoặc bật chỉ định.</p>`}
 ${check?`<div class="inline-alert ${check.ok?'green':'red'} mt8">${ico(check.ok?'check':'alert')}${check.ok?`Lịch hợp lệ. Dự kiến ${hm(check.timeline.start)}–${hm(check.timeline.end)}; giường sẵn sàng lại ${hm(check.timeline.bedReady)}.`:check.errors.slice(0,3).map(esc).join(' · ')}</div>`:''}</div>`;
 box._options=rec;
}
function visitDetail(v){
 let t=timeline(v),s=getStaff(v.staffId),b=getBed(v.bedId),cleanup=data.cleanups.find(c=>c.visitId===v.id&&c.status==='pending');
 showModal(`Lượt điều trị ${v.id}`,'Thông tin bệnh nhân, chiếm dụng tài nguyên và các giai đoạn điều trị',`<div class="row between wrap"><div><h3>${dateLong(v.date)} · ${esc(v.start)}–${hm(t.end)}</h3><p class="muted small">Tổng thời gian ${t.total} phút · Mã lượt ${esc(v.id)}</p></div>${pill(v.status)}</div>${patientTaskSummary(v)}<div class="grid3 mt16" style="gap:9px"><div class="data-box"><span class="section-label">NHÂN VIÊN PHỤ TRÁCH</span><div class="small bold mt8">${esc(s?.name||'—')}</div></div><div class="data-box"><span class="section-label">GIƯỜNG</span><div class="small bold mt8">${esc(b?.name||'—')}</div></div><div class="data-box"><span class="section-label">MÁY</span><div class="small bold mt8">${esc(getDevice(v.deviceId)?.name||'Không cần')}</div></div></div><h3 class="mt16 mb10">Các giai đoạn điều trị</h3><div class="stack gap8">${t.steps.sort((a,b)=>a.s-b.s).map((seg,i)=>`<div class="list-card"><span class="number-pill">${i+1}</span><div class="flex1"><strong class="small">${esc(getProc(seg.procId)?.name)} · ${esc(seg.name)}</strong><p>${esc(seg.staff?'Nhân viên trực tiếp':'Không giữ nhân viên')} · ${seg.bed?'Giữ giường':''}${seg.device?' · Giữ máy':''}</p></div><strong class="mono small">${hm(seg.s)}–${hm(seg.e)}</strong></div>`).join('')}</div><div class="summary-strip mt16"><div><strong>${t.total}p</strong><small>Thời gian điều trị</small></div><div><strong>${hm(t.staffReady)}</strong><small>Nhân viên chuyển lượt</small></div><div><strong>${hm(t.bedReady)}</strong><small>Giường dự kiến sẵn sàng</small></div><div><strong>${v.orderConfirmed?'Có':'Chưa'}</strong><small>Đã xác nhận chỉ định</small></div></div>${cleanup?`<div class="inline-alert mt16">${ico('alert')} Giường chưa được xác nhận vệ sinh.</div>`:''}${v.notes?`<div class="data-box mt16"><strong class="small">Ghi chú lượt điều trị</strong><p class="muted small">${esc(v.notes)}</p></div>`:''}`,`${btn('close-modal','Đóng','btn-outline')}${v.status==='planned'&&isLead()?btn('edit-visit',`${ico('edit')} Sửa`,'btn-outline',`data-id="${v.id}"`):''}${v.status==='planned'?btn('start-visit','Bắt đầu','btn-primary',`data-id="${v.id}"`):v.status==='in_progress'?btn('complete-visit','Kết thúc','btn-primary',`data-id="${v.id}"`):cleanup?btn('finish-cleanup','Xác nhận dọn giường','btn-primary',`data-id="${cleanup.id}"`):''}${v.status==='planned'&&isLead()?btn('cancel-visit','Hủy lịch','btn-danger',`data-id="${v.id}"`):''}`,true);
}
function bedDetail(b){let visits=data.visits.filter(v=>v.bedId===b.id&&v.date===vnDate()&&v.status!=='cancelled').sort((a,z)=>a.start.localeCompare(z.start));showModal(b.name,b.room,`<div class="row between"><strong>Trạng thái hiện tại</strong>${pillResource(bedStatus(b))}</div><div class="divider"></div><h3 class="mb10">Lượt điều trị trong ngày (${visits.length})</h3><div class="stack gap8">${visits.map(v=>`<div class="list-card"><span class="number-pill">${v.start}</span><div class="flex1"><h4>${esc(getPatient(v.patientId)?.name||'')}</h4><p>${esc(procName(v.procIds))} · ${esc(getStaff(v.staffId)?.name||'')}</p></div>${pill(v.status)}</div>`).join('')||'<p class="muted small">Không có lượt điều trị trong ngày.</p>'}</div><div class="inline-alert mt16">${ico('info')} Thời gian vệ sinh mặc định: ${data.settings.cleanup} phút sau mỗi lượt.</div>`);}
function downloadBlob(content,filename,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(`Đã tạo tệp ${filename}.`);}
function csvEscape(s){return '"'+String(s??'').replace(/"/g,'""')+'"';}
function exportCsv(date=ui.reportDate){let cols=['Mã lượt','Mã hồ sơ HIS','Ngày','Bắt đầu','Dự kiến kết thúc','Thủ thuật','Mã nhân viên','Giường','Máy','Trạng thái','Xác nhận chỉ định','Báo cáo loại'];let rows=dayVisits(date).map(v=>[v.id,getPatient(v.patientId)?.externalId,date,v.start,hm(timeline(v).end),procName(v.procIds),v.staffId,v.bedId,v.deviceId,v.status,v.orderConfirmed?'Đã đối chiếu demo':'Chưa','Bảng kê điều phối nội bộ (KHÔNG PHẢI BỆNH ÁN)']);let str='\ufeff'+[cols,...rows].map(row=>row.map(csvEscape).join(',')).join('\r\n');downloadBlob(str,`ClinicFlow_BaoCao_${date}.csv`,'text/csv;charset=utf-8');audit('Xuất CSV',`Báo cáo ngày ${date} (${rows.length} lượt)`);}
function exportJson(){const date=ui.reportDate;const obj={warning:'BẢN DEMO; không phải báo cáo chính thức, hồ sơ bệnh án hay hồ sơ đáp ứng chuẩn của Bộ Y tế.',generatedAt:new Date().toISOString(),clinic:data.clinic,reportDate:date,settings:data.settings,visits:dayVisits(date).map(v=>({...v,externalPatientId:getPatient(v.patientId)?.externalId,estimatedEnd:hm(timeline(v).end)})),staff:data.staff.map(s=>({id:s.id,name:s.name,position:s.position,skills:s.skills,shiftStart:s.shiftStart,shiftEnd:s.shiftEnd,licenseStatus:s.licenseStatus})),beds:data.beds,devices:data.devices,procedures:data.procedures,cleanups:data.cleanups,audit:data.audit};downloadBlob(JSON.stringify(obj,null,2),`ClinicFlow_MinhChung_${date}.json`,'application/json');audit('Xuất bộ minh chứng',`Đã xuất dữ liệu tham khảo ngày ${date} (JSON)`);}

function printReport(){let d=ui.reportDate,s=dashStats(d);let html=`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>ClinicFlow - Báo cáo nội bộ ${d}</title><style>body{font:13px Arial,sans-serif;margin:38px;color:#26312b}h1{font-size:22px;color:#14533f}h2{font-size:16px;margin-top:26px}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #bec9c2;padding:8px;text-align:left;font-size:11px}th{background:#eef4ee}.note{border:1px solid #cda76c;background:#fff7ec;padding:12px;margin:18px 0}.stats{display:flex;gap:20px}.stats p{padding:12px;border:1px solid #dce7df;flex:1}footer{margin-top:60px;display:flex;justify-content:space-between}.muted{color:#687b6d}@media print{button{display:none}}</style></head><body><h1>ClinicFlow · Báo cáo điều phối nội bộ</h1><p><b>Đơn vị:</b> ${esc(data.clinic.name)}<br><b>Ngày báo cáo:</b> ${dateLong(d)}<br><b>Ngày xuất:</b> ${esc(auditDate(new Date().toISOString()))}</p><div class="note"><b>LƯU Ý:</b> Bản mẫu nội bộ phục vụ đối chiếu lịch; không thay thế bệnh án, y lệnh, hồ sơ chuyên môn, hồ sơ khử khuẩn, chữ ký hoặc mẫu báo cáo cơ quan quản lý.</div><div class="stats"><p>Tổng lượt<br><b>${s.v.length}</b></p><p>Hoàn thành<br><b>${s.complete}</b></p><p>Thủ thuật<br><b>${s.totalProc}</b></p><p>Giường có lịch<br><b>${s.usedBeds}</b></p></div><h2>1. Bảng kê lịch điều trị</h2><table><tr><th>STT</th><th>Mã lượt</th><th>Mã bệnh nhân HIS</th><th>Giờ</th><th>Thủ thuật</th><th>Nhân viên</th><th>Giường/Máy</th><th>Trạng thái</th></tr>${s.v.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.id)}</td><td>${esc(getPatient(v.patientId)?.externalId)}</td><td>${v.start}–${hm(timeline(v).end)}</td><td>${esc(procName(v.procIds))}</td><td>${esc(getStaff(v.staffId)?.name)}</td><td>${esc(v.bedId)} / ${esc(v.deviceId||'—')}</td><td>${esc(sStatus(v.status)[1])}</td></tr>`).join('')}</table><h2>2. Danh mục thủ thuật áp dụng (bản demo)</h2><table><tr><th>Mã</th><th>Tên thủ thuật</th><th>Thời lượng bước</th><th>Tình trạng phê duyệt</th></tr>${data.procedures.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${p.steps.map(z=>`${esc(z.name)}: ${z.duration}p`).join('; ')}</td><td>${p.approved?'Đã phê duyệt demo':'Chưa'}</td></tr>`).join('')}</table><h2>3. Kiểm tra tài nguyên</h2><p>Nhân viên đang hoạt động: ${s.activeStaff}/${data.staff.length}. Giường sẵn sàng theo danh mục: ${s.availableBeds}/${data.beds.length}. Thiết bị hoạt động: ${data.devices.filter(d=>d.status==='active').length}/${data.devices.length}.</p><h2>4. Các hồ sơ cần đối chiếu ngoài hệ thống</h2><p>Hồ sơ bệnh án và y lệnh từ HIS/EMR; giấy phép và phạm vi hành nghề; phiếu bảo trì, vệ sinh và khử khuẩn; quy trình được duyệt; nhật ký truy cập và thay đổi.</p><footer><div>Người lập biểu<br><br>........................................</div><div>Người kiểm tra<br><br>........................................</div><div>Người có thẩm quyền<br><br>........................................</div></footer><p class="muted" style="margin-top:60px;font-size:10px">Dữ liệu giả lập · Tài liệu mẫu, không có giá trị chứng nhận tuân thủ</p></body></html>`;
 const win=window.open('','_blank');if(!win){toast('Trình duyệt đã chặn cửa sổ in. Hãy cho phép pop-up.','warn');return;}win.document.open();win.document.write(html);win.document.close();win.focus();setTimeout(()=>win.print(),400);audit('In báo cáo',`Báo cáo nội bộ ngày ${d}`);
}
function canOperateVisit(v){return isLead()||(role()==='staff'&&v.staffId===currentUser()?.staffId);}
function startVisit(v){if(!canOperateVisit(v)){toast('Bạn không được phân công lượt này.','error');return;}if(v.status!=='planned'){toast('Lượt này không ở trạng thái chờ.','warn');return;}v.status='in_progress';v.actualStartedAt=new Date().toISOString();audit('Bắt đầu điều trị',`${v.id} · ${v.patientId}`);closeModal();render();toast(`Đã bắt đầu lượt ${v.id}.`);}
function completeVisit(v){if(!canOperateVisit(v)){toast('Bạn không được cập nhật lượt này.','error');return;}if(v.status!=='in_progress'){toast('Cần bắt đầu lượt trước khi kết thúc.','warn');return;}v.status='completed';v.actualCompletedAt=new Date().toISOString();let pending=data.cleanups.find(c=>c.visitId===v.id&&c.status==='pending');if(!pending)data.cleanups.push({id:id('CL'),visitId:v.id,bedId:v.bedId,status:'pending',createdAt:new Date().toISOString(),completedAt:null});audit('Hoàn thành điều trị',`${v.id}; ${v.bedId} cần vệ sinh`);closeModal();render();toast(`Đã hoàn thành ${v.id}. ${getBed(v.bedId)?.name} đang chờ dọn.`, 'warn');}
function finishCleanup(c){if(!c||c.status!=='pending')return;if(!isLead() && role()!=='staff'){toast('Không đủ quyền.','error');return;}c.status='done';c.completedAt=new Date().toISOString();audit('Xác nhận vệ sinh giường',`${c.visitId}, ${c.bedId}`);closeModal();render();toast(`${getBed(c.bedId)?.name} đã được xác nhận sẵn sàng.`);}
function deleteItem(type,key){if(!isOwner()&&type!=='patient'){toast('Chỉ Chủ phòng khám có thể xóa danh mục.','error');return;}if(type==='patient'&&!isLead()){toast('Bạn không đủ quyền.','error');return;}
 let m={patient:[data.patients,'id','Bệnh nhân'],staff:[data.staff,'id','Nhân viên'],bed:[data.beds,'id','Giường'],device:[data.devices,'id','Thiết bị'],procedure:[data.procedures,'id','Thủ thuật']}[type];if(!m)return;let [items,,label]=m,thing=items.find(x=>x.id===key);if(!thing)return;
 let used=type==='patient'?data.visits.some(v=>v.patientId===key):type==='staff'?data.visits.some(v=>v.staffId===key):type==='bed'?data.visits.some(v=>v.bedId===key):type==='device'?data.visits.some(v=>v.deviceId===key):data.visits.some(v=>v.procIds.includes(key))||data.staff.some(s=>s.skills.includes(key));
 if(used){if(type==='patient'){thing.status='inactive';audit('Ngừng sử dụng bệnh nhân',`${key} (giữ lịch sử)`);render();toast('Có lịch sử điều trị; đã đánh dấu ngừng sử dụng thay vì xóa.','warn');return;}if(type==='staff'){thing.status='off';audit('Ngưng phân công nhân viên',key);render();toast('Nhân viên có lịch sử; đã ngưng hoạt động.','warn');return;}if(type==='bed'||type==='device'){thing.status='maintenance';audit('Ngừng tài nguyên',key);render();toast('Tài nguyên có lịch sử; đã chuyển sang bảo trì.','warn');return;}if(type==='procedure'){thing.active=false;audit('Ngừng thủ thuật',key);render();toast('Thủ thuật có tham chiếu; đã tạm ngưng thay vì xóa.','warn');return;}}
 if(!confirm(`${label} ${thing.name||thing.id} chưa có tham chiếu lịch. Xóa khỏi dữ liệu mẫu?`))return;data[type==='patient'?'patients':type==='staff'?'staff':type==='bed'?'beds':type==='device'?'devices':'procedures']=items.filter(x=>x.id!==key);audit('Xóa '+label,key);render();toast('Đã xóa dữ liệu mẫu.');
}
function notify(){let al=alerts();showModal('Trung tâm thông báo',`Có ${al.length} thông báo trong ngày`,`${al.map(a=>`<div class="notification-item"><div class="notification-icon">${ico('bell')}</div><div><strong class="small">${esc(a.title)}</strong><p>${esc(a.desc)}</p></div></div>`).join('')||'<div class="inline-alert green">Không có thông báo cần xử lý.</div>'}<div class="inline-alert blue mt16">${ico('info')} Thông báo demo được tính từ trạng thái lịch, kiểm tra tự động khi trang đang mở.</div>`);}

function userModal(u){showModal('Phân quyền tài khoản','Chỉ quản trị bản demo, không phải RBAC thực ở máy chủ.',`<form id="user-form" class="form-grid">${field('u-name','Tên hiển thị',u.name,'text','required')}${field('u-email','Email',u.email,'email','required')}${selectField('u-role','Vai trò',Object.entries(ROLES),u.role)}${selectField('u-staff','Liên kết nhân viên',[['','Không liên kết'],...data.staff.map(s=>[s.id,s.name])],u.staffId)}<input type="hidden" name="editId" value="${u.id}"></form>`,`${btn('close-modal','Hủy','btn-outline')}<button form="user-form" class="btn btn-primary">Lưu phân quyền</button>`);}
function handleFormSubmit(e){let f=e.target;if(!f.id)return;e.preventDefault();const el=n=>f.elements.namedItem(n);const val=n=>(el(n)?.value||'').trim();
 if(f.id==='auth-form'){let mail=val('auth-email').toLowerCase(),pass=val('auth-password');if(ui.authTab==='register'){let name=val('auth-name');if(!name||!mail||pass.length<6){toast('Vui lòng điền đầy đủ, mật khẩu từ 6 ký tự.','error');return;}if(data.users.some(u=>u.email===mail)){toast('Email đã có tài khoản.','error');return;}let newStaff={id:id('NV'),name,position:'Nhân viên mới (demo)',skills:[],shiftStart:'07:00',shiftEnd:'18:00',status:'off',licenseStatus:'Chờ xác minh',note:'Chờ quản trị xác minh và gán kỹ năng'},u={id:id('U'),name,email:mail,password:pass,role:'staff',staffId:newStaff.id};data.staff.push(newStaff);data.users.push(u);audit('Đăng ký tài khoản demo',mail);session={userId:u.id,asRole:null};persistSession();ui.view='dashboard';render();toast('Đã tạo tài khoản demo vai trò Nhân viên.');}else{let u=data.users.find(x=>x.email.toLowerCase()===mail&&x.password===pass);if(!u){toast('Sai email hoặc mật khẩu.','error');return;}session={userId:u.id,asRole:null};persistSession();ui.view='dashboard';render();toast(`Xin chào, ${u.name}!`);}return;}
 if(f.id==='patient-form'){let edit=val('editId'),obj=data.patients.find(p=>p.id===edit);let external=val('p-external');if(data.patients.some(p=>p.externalId===external&&p.id!==edit)){toast('Mã hồ sơ HIS đã được sử dụng.','error');return;}let x={name:val('p-name'),externalId:external,year:Number(val('p-year'))||null,gender:val('p-gender'),phone:val('p-phone').trim(),note:val('p-note'),status:val('p-status')};if(obj)Object.assign(obj,x);else data.patients.push({id:id('BN'),...x});audit(obj?'Sửa bệnh nhân':'Thêm bệnh nhân',`${external} · ${x.name}`);closeModal();render();toast('Đã lưu thông tin tham chiếu.');return;}
 if(f.id==='staff-form'){if(!isOwner())return;let old=data.staff.find(s=>s.id===val('editId'));let skills=[...f.querySelectorAll('[name="skills"]:checked')].map(x=>x.value);let x={name:val('s-name'),position:val('s-position'),shiftStart:val('s-shift-start'),shiftEnd:val('s-shift-end'),status:val('s-status'),skills,note:val('s-note'),licenseStatus:val('s-license')};if(minute(x.shiftStart)>=minute(x.shiftEnd)){toast('Giờ kết thúc ca phải sau giờ bắt đầu.','error');return;}if(old)Object.assign(old,x);else data.staff.push({id:id('NV'),...x});audit(old?'Sửa nhân sự':'Thêm nhân sự',x.name);closeModal();render();toast('Đã lưu nhân viên.');return;}
 if(f.id==='resource-form'){if(!isOwner())return;let type=val('kind'),items=type==='bed'?data.beds:data.devices,old=items.find(x=>x.id===val('editId'));let x={name:val('res-name'),status:val('res-status'),note:val('res-note')};if(type==='bed')x.room=val('res-room');else x.type=val('res-type');if(old)Object.assign(old,x);else items.push({id:id(type==='bed'?'G':'M'),...x});audit(old?'Sửa tài nguyên':'Thêm tài nguyên',x.name);closeModal();render();toast('Đã lưu tài nguyên.');return;}
 if(f.id==='procedure-form'){if(!isOwner())return;let old=data.procedures.find(p=>p.id===val('editId'));let steps=[...f.querySelectorAll('[data-step-row]')].map(r=>({name:r.querySelector('.step-name').value.trim(),duration:Number(r.querySelector('.step-duration').value),staff:r.querySelector('.step-staff').checked,bed:r.querySelector('.step-bed').checked,device:r.querySelector('.step-device').checked}));if(!steps.length||steps.some(s=>!s.name||s.duration<=0||s.duration>300||!(s.staff||s.bed||s.device))){toast('Mỗi giai đoạn cần tên, thời lượng hợp lệ và ít nhất một tài nguyên.','error');return;}let overlapWith=[...f.querySelectorAll('[name="overlapWith"]:checked')].map(x=>x.value);let p={name:val('pr-name'),code:val('pr-code'),category:val('pr-category'),deviceType:val('pr-device'),active:!!f.querySelector('#pr-active')?.checked,approved:!!f.querySelector('#pr-approved')?.checked,steps,overlapWith,color:old?.color||procColor(data.procedures.length)};
 if(data.procedures.some(x=>x.code===p.code&&x.id!==old?.id)){toast('Mã thủ thuật đã tồn tại.','error');return;}if(steps.some(s=>s.device)&&!p.deviceType){toast('Có giai đoạn cần máy: hãy chọn loại thiết bị.','error');return;}if(old)Object.assign(old,p);else data.procedures.push({id:id('PR'),...p});audit(old?'Sửa cấu hình thủ thuật':'Tạo thủ thuật',`${p.code} · ${p.name} · ${steps.length} bước`);closeModal();render();toast('Đã lưu thủ thuật; cần rà soát các lịch hiện có.','warn');return;}
 if(f.id==='rules-form'){if(!isOwner())return;let s=data.settings,updates={gapProcedures:Number(val('gapProcedures')),gapPatients:Number(val('gapPatients')),cleanup:Number(val('cleanup')),allowOverlap:!!el('allowOverlap')?.checked,allowMachineRelease:!!el('allowMachineRelease')?.checked,workStart:val('workStart'),workEnd:val('workEnd')};if([updates.gapProcedures,updates.gapPatients,updates.cleanup].some(x=>x<0||x>120)||minute(updates.workStart)>=minute(updates.workEnd)){toast('Giá trị quy tắc không hợp lệ.','error');return;}Object.assign(s,updates);audit('Đổi quy tắc điều phối',JSON.stringify(updates));render();toast('Đã lưu quy tắc. Hãy rà soát lại lịch đã xếp.','warn');return;}
 if(f.id==='visit-form'){if(!isLead())return;let v=readVisitForm(),old=data.visits.find(x=>x.id===v.id);let result=validate(v,{excludeId:old?.id});if(!result.ok){toast(result.errors.slice(0,2).join(' | '),'error');refreshVisitRecommendation();return;}if(old){if(old.status!=='planned'){toast('Chỉ sửa lịch chưa bắt đầu.','error');return;}Object.assign(old,v);old.status='planned';}else data.visits.push({...v,id:id('V'),status:'planned',cleanupDone:false,createdAt:new Date().toISOString(),createdBy:currentUser()?.name});audit(old?'Sửa lịch điều trị':'Xếp lịch điều trị',`${v.patientId} · ${v.date} ${v.start} · ${v.staffId} · ${v.bedId}`);closeModal();ui.operationDate=v.date;ui.view='operation';render();toast(`Xếp lịch thành công. Kết thúc dự kiến ${hm(result.timeline.end)}.`);return;}
 if(f.id==='clinic-form'){if(!isOwner())return;data.clinic.name=val('clinic-name');data.clinic.code=val('clinic-code');data.clinic.address=val('clinic-address');audit('Cập nhật phòng khám',data.clinic.name);render();toast('Đã lưu thông tin phòng khám.');return;}
 if(f.id==='user-form'){if(!isOwner())return;let old=data.users.find(u=>u.id===val('editId'));if(!old)return;if(data.users.some(u=>u.email===val('u-email')&&u.id!==old.id)){toast('Email trùng.','error');return;}old.name=val('u-name');old.email=val('u-email');old.role=val('u-role');old.staffId=val('u-staff');audit('Phân quyền tài khoản',`${old.email} · ${old.role}`);closeModal();render();toast('Đã cập nhật phân quyền demo.');return;}
}

function cfSnapshotStaff(s,date,time){
 if(s.status!=='active'||s.licenseStatus!=='Đã xác minh nội bộ')return {state:'off',label:s.status==='active'?'Chờ xác minh':'Vắng / nghỉ',info:'Không thể nhận lịch mới'};
 const m=minute(time);if(m<minute(s.shiftStart)||m>=minute(s.shiftEnd))return {state:'off',label:'Ngoài ca',info:`Ca ${s.shiftStart}–${s.shiftEnd}`};
 const visits=dayVisits(date).filter(v=>v.staffId===s.id&&v.status!=='completed');
 let direct=null, machine=null, next=null;
 for(const v of visits){const t=timeline(v);if(t.staff.some(z=>z.s<=m&&m<z.e)){direct={v,t};break;}
  if(t.start<=m&&m<t.end&&t.steps.some(z=>!z.staff&&z.s<=m&&m<z.e)){machine={v,t};}
  if(t.staff.some(z=>z.s>m)){const first=t.staff.find(z=>z.s>m)?.s;if(first!=null&&(!next||first<next.at))next={at:first,v};}
 }
 if(direct){let v=direct.v;return {state:'busy',label:'Đang thao tác',info:procName(v.procIds),visit:v,patient:getPatient(v.patientId),bed:getBed(v.bedId),until:hm(Math.max(...direct.t.staff.filter(z=>z.s<=m&&z.e>m).map(z=>z.e)))}};
 if(machine){let v=machine.v;return {state:'machine',label:'Có thể nhận việc khác*',info:'Máy đang chạy tại '+(getBed(v.bedId)?.name||v.bedId),visit:v,patient:getPatient(v.patientId),bed:getBed(v.bedId),until:hm(machine.t.end),next};}
 return {state:'free',label:'Rảnh thao tác',info:next?`Lượt kế tiếp ${hm(next.at)} · ${getPatient(next.v.patientId)?.name||''}`:'Chưa có việc tiếp theo',next};
}
function cfSnapshotBed(b,date,time){
 if(b.status!=='active')return {state:'off',label:'Bảo trì',info:b.note||'Đang ngừng sử dụng'};
 if(data.cleanups.some(c=>c.bedId===b.id&&c.status==='pending')){let c=data.cleanups.find(c=>c.bedId===b.id&&c.status==='pending');return {state:'clean',label:'Chờ vệ sinh',info:'Lượt '+c.visitId+' chưa xác nhận',visit:data.visits.find(v=>v.id===c.visitId)};}
 const m=minute(time),v=dayVisits(date).find(v=>v.bedId===b.id&&v.status!=='completed'&&timeline(v).start<=m&&m<timeline(v).bedReady);
 if(v){let t=timeline(v),clean=m>=t.end;return {state:clean?'clean':'busy',label:clean?'Trong thời gian dọn':'Đang sử dụng',info:`${v.start}–${hm(t.end)} · ${procName(v.procIds)}`,visit:v,patient:getPatient(v.patientId),staff:getStaff(v.staffId),ready:hm(t.bedReady)};}
 const next=dayVisits(date).filter(v=>v.bedId===b.id&&v.status!=='completed'&&minute(v.start)>m).sort((a,b)=>minute(a.start)-minute(b.start))[0];
 return {state:'free',label:'Trống',info:next?`Lượt kế tiếp ${next.start} · ${getPatient(next.patientId)?.name||''}`:'Có thể đặt lịch',next};
}

function cfChartLine(items){let W=620,H=215,padX=36,padY=19,w=W-2*padX,h=H-2*padY,max=Math.max(1,...items.map(d=>d.value));
 const pt=items.map((d,i)=>({x:padX+(items.length<=1?.5:i/(items.length-1))*w,y:H-padY-d.value/max*(h-19)}));

 return `<svg class="cf-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ xu hướng lượt điều trị: ${items.map(d=>`${d.label}: ${d.value}`).join(', ')}"><defs><linearGradient id="cfFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#69b596" stop-opacity=".22"/><stop offset="1" stop-color="#69b596" stop-opacity=".015"/></linearGradient></defs>${[0,.25,.5,.75,1].map(q=>`<line x1="${padX}" x2="${W-padX}" y1="${H-padY-q*(h-19)}" y2="${H-padY-q*(h-19)}" class="cf-tick"/>`).join('')}<path d="${area}" class="cf-area"/><path d="${path}" class="cf-main-line"/>${pt.map((p,i)=>`<circle class="cf-dot" cx="${p.x}" cy="${p.y}" r="3.8"><title>${items[i].label}: ${items[i].value} lượt</title></circle>`).join('')}${items.map((d,i)=>`<text x="${pt[i].x}" y="${H-4}" text-anchor="middle">${cfH(d.label)}</text>`).join('')}<text x="5" y="${H-padY-h+15}">${max}</text><text x="8" y="${H-padY+3}">0</text></svg>`;}
function cfChartBars(items){const W=560,H=215,padX=30,padY=27,w=W-2*padX,h=H-2*padY,max=Math.max(1,...items.map(x=>x.value)),gap=w/Math.max(1,items.length);return `<svg class="cf-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ số lượt theo giờ">${[0,.5,1].map(k=>`<line class="cf-tick" x1="${padX}" x2="${W-padX}" y1="${H-padY-k*h}" y2="${H-padY-k*h}"/>`).join('')}${items.map((item,i)=>{let bh=item.value/max*(h-12);return `<rect class="cf-bar ${i===items.length-2?'cf-highlight':''}" x="${padX+i*gap+gap*.19}" y="${H-padY-bh}" width="${gap*.62}" height="${bh}" rx="5"><title>${item.label}: ${item.value} lượt</title></rect><text x="${padX+i*gap+gap*.5}" y="${H-6}" text-anchor="middle">${cfH(item.label)}</text>`;}).join('')}</svg>`;}
